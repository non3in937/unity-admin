<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RunNShoot — задачи</title>
<style>
:root{
  --bg:#14161a; --panel:#1c1f26; --panel2:#232733; --line:#2e3340;
  --txt:#e6e9ef; --dim:#8b93a3; --acc:#4f8cff; --ok:#3fbf6a; --warn:#e0a33e;
  --e0:#3fbf6a; --e1:#e05c5c; --e2:#4f8cff; --e3:#8b7fd6; --bl:#6b7280;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; background:var(--bg); color:var(--txt); overscroll-behavior:none;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body.dragging{overflow:hidden; touch-action:none; user-select:none}

header{position:sticky; top:0; z-index:20; background:var(--panel);
  border-bottom:1px solid var(--line); padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex; align-items:center; gap:9px; flex-wrap:nowrap; min-width:0}
h1{font-size:16px; margin:0; font-weight:650; white-space:nowrap; flex:none}
.spacer{flex:1}
button{font:inherit; color:var(--txt); background:var(--panel2);
  border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer}
button:active{transform:translateY(1px)}
button.primary{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600}
button.primary:disabled{opacity:.45; cursor:default}
#status{font-size:12.5px; color:var(--dim); margin-top:9px; display:none}
#reload{transition:color .2s, border-color .2s, background .2s}
#reload.ready{color:var(--ok); border-color:var(--ok); background:#3fbf6a1f}
#reload.busy{color:var(--dim); border-color:var(--line); background:var(--panel2); opacity:.6}
#reload.fail{color:var(--e1); border-color:var(--e1); background:#e05c5c1f}
#ver{font-size:11px; color:var(--dim); opacity:.65; white-space:nowrap; flex:none}
.prow{margin-top:10px}
header button{flex:none; white-space:nowrap}
#status.err{color:var(--e1)} #status.ok{color:var(--ok)}
.bar{height:5px; background:var(--panel2); border-radius:99px; overflow:hidden; margin-top:6px}
.bar>i{display:block; height:100%; background:var(--ok); width:0; transition:width .25s}

/* ── фильтры: выпадающие группы */
.filters{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap}
.fg{position:relative}
.fbtn{display:flex; align-items:center; gap:6px; font-size:13px; padding:6px 11px;
  border-radius:99px; background:var(--panel2); border:1px solid var(--line);
  color:var(--dim); cursor:pointer; user-select:none; white-space:nowrap}
.fbtn.on{background:var(--acc); border-color:var(--acc); color:#fff}
.fbtn .car{font-size:9px; opacity:.7}
.fpop{position:fixed; z-index:60; min-width:200px;
  max-height:56vh; overflow-y:auto; background:var(--panel2); border:1px solid var(--line);
  border-radius:11px; padding:5px; display:none; box-shadow:0 12px 34px #000b}
.fpop.on{display:block}
.fopt{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:7px;
  font-size:13.5px; cursor:pointer; white-space:nowrap}
.fopt:hover{background:#ffffff0d}
.fopt .tick{flex:none; width:16px; height:16px; border-radius:4px; border:1.5px solid var(--line);
  background:var(--bg); position:relative}
.fopt.sel .tick{background:var(--acc); border-color:var(--acc)}
.fopt.sel .tick:after{content:""; position:absolute; left:5px; top:1.5px; width:4px; height:8px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}
.fclear{border-bottom:1px solid var(--line); margin-bottom:4px; padding-bottom:4px}
.fclear .fopt{color:var(--dim); justify-content:center}

#board{padding:14px}
#binner{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; align-items:stretch;
  transform-origin:0 0}
.col{background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:10px; min-height:120px}
.col.over{border-color:var(--acc); background:#4f8cff12}
.colhead{display:flex; align-items:center; gap:8px; margin-bottom:9px; font-weight:650; font-size:13.5px;
  user-select:none; -webkit-user-select:none}
.count{font-size:12px; color:var(--dim); background:var(--panel2);
  border-radius:99px; padding:1px 8px; font-weight:500}
.card{background:var(--panel2); border:1px solid var(--line); border-left-width:3px;
  border-radius:9px; padding:10px; margin-bottom:8px; cursor:grab; touch-action:pan-x pan-y;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
.card.dragging{opacity:.32}
.card.ghost{position:fixed; z-index:70; pointer-events:none; margin:0; opacity:1;
  cursor:grabbing; box-shadow:0 14px 34px #000a; transform:rotate(1.5deg)}
.card h3{margin:0 0 7px; font-size:13.5px; font-weight:550; line-height:1.35}
.meta{display:flex; gap:5px; flex-wrap:wrap; align-items:center}
.tag{font-size:10.5px; padding:2px 7px; border-radius:99px; background:#00000038;
  color:var(--dim); border:1px solid var(--line)}
.tag.stage{color:#c3cad8; border-color:#48506180; font-weight:600}
.tag.warn{color:var(--e1); border-color:#e05c5c66; background:#e05c5c1a; font-weight:600}
.tag.sec{color:#a9b2c4}
.prog{font-size:11.5px; color:var(--dim); margin-top:7px; display:flex; align-items:center; gap:7px}
.prog .bar{flex:1; margin:0; height:4px}

#modal{position:fixed; inset:0; background:#000a; display:none; z-index:85;
  align-items:center; justify-content:center; padding:16px}
#modal.on{display:flex}
.sheet{background:var(--panel); border:1px solid var(--line); border-radius:14px;
  width:100%; max-width:620px; max-height:86vh; display:flex; flex-direction:column}
.shead{padding:16px 18px; border-bottom:1px solid var(--line); position:relative}
.shead h2{margin:0 46px 9px 0; font-size:17px; font-weight:600; line-height:1.3}
#mclose{position:absolute; top:12px; right:12px; width:34px; height:34px; padding:0;
  border-radius:9px; font-size:19px; line-height:1; color:var(--dim)}
.sbody{padding:8px 18px 18px; overflow-y:auto}
.chk{display:flex; gap:11px; align-items:flex-start; padding:9px 0;
  border-bottom:1px solid #ffffff0d; cursor:pointer;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
.chk:last-child{border-bottom:none}
.box{flex:none; width:19px; height:19px; border-radius:5px; border:1.5px solid var(--line);
  background:var(--panel2); margin-top:1px; position:relative}
.chk.done .box{background:var(--ok); border-color:var(--ok)}
.chk.done .box:after{content:""; position:absolute; left:6px; top:2px; width:5px; height:10px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}
.chk.done span{color:var(--dim); text-decoration:line-through}
.chk span{font-size:14px; line-height:1.4}
.chk .info{flex:none; margin-left:auto; width:21px; height:21px; border-radius:50%;
  border:1px solid var(--line); background:var(--bg); color:var(--dim);
  font-size:11px; font-weight:700; line-height:19px; text-align:center; cursor:pointer}
.chk .info.on{color:#fff; background:var(--acc); border-color:var(--acc)}
.chk .warn{flex:none; width:21px; height:21px; border-radius:50%; margin-left:6px;
  border:1px solid #e05c5c66; background:#e05c5c1a; color:var(--e1);
  font-size:12px; font-weight:700; line-height:19px; text-align:center; cursor:pointer}
.chk .warn.ok{border-color:#3fbf6a66; background:#3fbf6a1a; color:var(--ok)}
.chk .warn.on{background:var(--e1); color:#fff; border-color:var(--e1)}
.chk .warn.ok.on{background:var(--ok); border-color:var(--ok)}
.blk{font-size:12.5px; line-height:1.5; background:#e05c5c14;
  border-left:2px solid var(--e1); border-radius:0 8px 8px 0;
  padding:10px 12px; margin:0 0 10px 30px; display:none}
.blk.on{display:block}
.blk.done{background:#3fbf6a14; border-left-color:var(--ok)}
.blk h5{margin:0 0 7px; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--e1); font-weight:700}
.blk.done h5{color:var(--ok)}
.blk .bt{display:flex; align-items:center; gap:8px; padding:5px 0; cursor:pointer}
.blk .bt .st{flex:none; width:8px; height:8px; border-radius:50%}
.blk .bt .tt{flex:1; color:var(--txt); font-size:13px; min-width:0}
.blk .bt .sg{flex:none; font-size:10px; padding:1px 6px; border-radius:99px;
  border:1px solid var(--line); color:var(--dim)}
.blk .why{color:var(--dim); margin:6px 0 0}

.hint{font-size:12.5px; line-height:1.5; color:var(--dim); background:#ffffff08;
  border-left:2px solid var(--acc); border-radius:0 8px 8px 0;
  padding:9px 12px; margin:0 0 10px 30px; display:none}
.hint.on{display:block}
.empty{color:var(--dim); font-size:12.5px; padding:6px 0}
.csec{margin-top:18px; border-top:1px solid var(--line); padding-top:14px}
.csec h4{margin:0 0 10px; font-size:12px; color:var(--dim); font-weight:600;
  text-transform:uppercase; letter-spacing:.06em}
.cm{display:flex; gap:9px; align-items:flex-start; padding:9px 11px; margin-bottom:8px;
  background:var(--panel2); border:1px solid var(--line); border-radius:9px}
.cm .body{flex:1; min-width:0}
.cm p{margin:0; font-size:13.5px; line-height:1.45; white-space:pre-wrap; word-break:break-word}
.cm time{display:block; margin-top:5px; font-size:11px; color:var(--dim)}
.cm .del{flex:none; color:var(--dim); font-size:15px; line-height:1; cursor:pointer;
  padding:1px 2px 1px 8px; opacity:.5}
.cm .del:active{opacity:1; color:var(--e1)}
.cadd{display:flex; gap:8px; margin-bottom:12px}
.cadd textarea{flex:1; min-width:0; font:inherit; font-size:16px; color:var(--txt);
  background:var(--panel2); border:1px solid var(--line); border-radius:9px;
  padding:10px 12px; resize:vertical; min-height:44px; max-height:160px}
.cadd textarea:focus{outline:none; border-color:var(--acc)}
.cadd button{align-self:flex-end}

/* полоса прогресса с кнопкой дашборда */
.brow{display:flex; align-items:center; gap:10px; margin-top:6px}
.brow .bar{flex:1; margin:0}
#dash{flex:none; width:30px; height:30px; padding:0; border-radius:50%;
  display:flex; align-items:center; justify-content:center}
#dash{border-color:var(--line)}
#dash svg{width:19px; height:19px}
/* Масштаб — вспомогательный, поэтому меньше заметок и стоит в самом углу.
   Заметки крупнее и отцентрованы по его оси: 20+44/2 = 14+56/2 = 42 от края. */
#zoombtn{position:fixed; right:20px; z-index:45; width:44px; height:44px; padding:0;
  bottom:calc(20px + env(safe-area-inset-bottom));
  border-radius:50%; background:var(--panel); border:1px solid var(--line);
  color:var(--dim); box-shadow:0 6px 16px #0006;
  display:none; align-items:center; justify-content:center}
#zoombtn svg{width:19px; height:19px}
#zoombtn.on{color:#fff; background:var(--acc); border-color:var(--acc)}
@media (max-width:820px){ #zoombtn{display:flex} }

/* дашборд */
#board2{position:fixed; inset:0; background:var(--bg); z-index:75; display:none; flex-direction:column}
#board2.on{display:flex}
.dbody{flex:1; overflow-y:auto; padding:16px 16px 40px}
.dchips{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:10px}
.dmode{display:flex; justify-content:center; margin-bottom:18px}
.seg{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:99px; padding:3px}
.seg div{font-size:13px; padding:6px 16px; border-radius:99px; cursor:pointer;
  color:var(--dim); user-select:none; -webkit-user-select:none}
.seg div.on{background:var(--acc); color:#fff; font-weight:600}
.lt .sc{flex:none; font-size:10px; padding:1px 6px; border-radius:99px;
  background:#00000038; border:1px solid var(--line); color:var(--dim)}
.donut{display:block; margin:0 auto; width:min(100%,360px); height:auto}
.donut circle.sl{cursor:pointer}
.donut .lbl{font-size:2.9px; font-weight:600}
.donut .lead{stroke-width:.35; opacity:.65}
.dback{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.dback button{font-size:13px; padding:6px 12px}
.dback b{font-size:15px}
.dcap{text-align:center; color:var(--dim); font-size:13px; margin-top:10px}
.dcap b{color:var(--txt); font-weight:600}
.lrow.empty .lname, .lrow.empty .lpct{color:var(--dim); opacity:.55}
.dmid{font-size:26px; font-weight:700; fill:var(--txt)}
.legend{margin-top:22px}
.lrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #ffffff0d;
  cursor:pointer; user-select:none; -webkit-user-select:none}
.lrow.open{background:var(--panel2); border-bottom-color:transparent;
  margin:0 -10px; padding:11px 10px 9px; border-radius:11px 11px 0 0;
  box-shadow:0 -1px 0 #ffffff10 inset, 1px 0 0 #ffffff10 inset, -1px 0 0 #ffffff10 inset}
.lrow.open .lname{color:#fff; font-weight:600}
.lsub{background:var(--panel2); margin:0 -10px 10px; padding:2px 10px 12px 33px;
  border-radius:0 0 11px 11px; border-bottom:none;
  box-shadow:0 1px 0 #ffffff10 inset, 1px 0 0 #ffffff10 inset, -1px 0 0 #ffffff10 inset}
.lsub .lt{border-bottom:1px solid #ffffff08}
.lsub .lt:last-child{border-bottom:none}
.lt{display:flex; align-items:center; gap:8px; padding:7px 0; cursor:pointer}
.lt .st{flex:none; width:8px; height:8px; border-radius:50%}
.lt .tt{flex:1; font-size:13px; line-height:1.35; min-width:0}
.lt .sg{flex:none; font-size:10px; padding:1px 6px; border-radius:99px;
  border:1px solid var(--line); color:var(--dim)}
.lt .cnt{flex:none; font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums}
.lt.done .tt{color:var(--dim)}
.lrow:last-child{border-bottom:none}
.ldot{flex:none; width:13px; height:13px; border-radius:50%}
.lname{flex:1; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lpct{flex:none; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums}
.lbar{flex:none; width:64px; height:5px; background:var(--panel2); border-radius:99px; overflow:hidden}
.lbar>i{display:block; height:100%; background:var(--ok)}
.dnote{color:var(--dim); font-size:12.5px; line-height:1.5; margin-top:20px}

/* круглая кнопка заметок */
#fab{position:fixed; right:14px; z-index:45; width:56px; height:56px; padding:0;
  bottom:calc(78px + env(safe-area-inset-bottom));
  border-radius:50%; background:var(--acc); border:none; color:#fff; font-size:23px;
  box-shadow:0 8px 22px #0007; display:flex; align-items:center; justify-content:center}
#fab .dot{position:absolute; top:-2px; right:-2px; min-width:18px; height:18px; padding:0 5px;
  border-radius:99px; background:var(--e1); color:#fff; font-size:10.5px; font-weight:700;
  line-height:18px; display:none}
#fab .dot.on{display:block}

/* экран заметок */
#notes{position:fixed; inset:0; background:var(--bg); z-index:75; display:none; flex-direction:column}
#notes.on{display:flex}
.nhead{padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line); display:flex; align-items:center; gap:9px}
.nhead h2{margin:0; font-size:17px; font-weight:650; flex:1}
.nadd{display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line)}
.nadd input{flex:1; min-width:0; font:inherit; font-size:16px; color:var(--txt);
  background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:10px 12px}
.nadd input:focus{outline:none; border-color:var(--acc)}
.nbody{flex:1; overflow-y:auto; padding:10px 16px 40px}
.note{display:flex; gap:11px; align-items:flex-start; padding:11px 0;
  border-bottom:1px solid #ffffff0d; user-select:none; -webkit-user-select:none}
.note .box{flex:none; width:21px; height:21px; border-radius:6px; border:1.5px solid var(--line);
  background:var(--panel2); position:relative; cursor:pointer}
.note.done .box{background:var(--ok); border-color:var(--ok)}
.note.done .box:after{content:""; position:absolute; left:7px; top:3px; width:5px; height:11px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}
.note p{margin:0; flex:1; font-size:15px; line-height:1.4; word-break:break-word}
.note.done p{color:var(--dim); text-decoration:line-through}
.note .del{flex:none; color:var(--dim); font-size:17px; line-height:1; padding:2px 4px 2px 12px;
  cursor:pointer; opacity:.55}
.note .del:active{opacity:1; color:var(--e1)}
.undo{display:flex; align-items:center; gap:10px; background:#4f8cff1a;
  border:1px solid var(--acc); border-radius:9px; padding:10px 12px; margin-bottom:10px}
.undo p{margin:0; flex:1; font-size:13px; color:var(--dim); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.undo button{padding:5px 11px; font-size:13px}
.nsect{font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em;
  margin:22px 0 4px; display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none}
.nsect .car{font-size:9px}
.nempty{color:var(--dim); font-size:13.5px; padding:14px 0}

#gate{position:fixed; inset:0; background:var(--bg); z-index:80; display:none;
  align-items:center; justify-content:center; padding:24px}
#gate.on{display:flex}
.gbox{max-width:380px; width:100%; text-align:center}
.gbox h2{font-size:19px; margin:0 0 10px}
.gbox p{color:var(--dim); font-size:13.5px; line-height:1.5; margin:0 0 18px}
.gbox input{width:100%; font:inherit; font-size:16px; color:var(--txt); background:var(--panel2);
  border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:10px}
.gbox input:focus{outline:none; border-color:var(--acc)}
.gbox button{width:100%; padding:11px}
#gerr{color:var(--e1); font-size:13px; min-height:18px; margin-top:10px}

@media (max-width:820px){
  .hrow{gap:7px}
  h1{font-size:14px}
  #ver{font-size:10.5px}
  header button{padding:6px 9px; font-size:12.5px}
  .sheet{max-height:92vh}
  .filters{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
    margin-left:-14px; margin-right:-14px; padding:0 14px 2px}
  .filters::-webkit-scrollbar{display:none}
  .fg{flex:none}
  #board{padding:10px; overflow-x:auto; scroll-snap-type:x proximity;
    scrollbar-width:none; -webkit-overflow-scrolling:touch}
  #board::-webkit-scrollbar{display:none}
  #binner{display:flex; grid-template-columns:none; gap:10px; align-items:stretch}
  .col{flex:0 0 300px; scroll-snap-align:start; padding:9px}
  body.dragging #board, #board.scaled{scroll-snap-type:none}
  /* масштаб ведётся из кода: #binner.style.transform — вёрстка не пересобирается */
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>RunNShoot</h1>
    <span id="ver"></span>
    <div class="spacer"></div>
    <button id="reload" class="busy" disabled>Обновить</button>
    <button id="save" class="primary" disabled>Сохранить</button>
  </div>
  <div id="status"></div>
  <div class="prow"><span class="count" id="total">—</span></div>
  <div class="brow">
    <div class="bar"><i id="gbar"></i></div>
    <button id="dash" title="Дашборд"><svg viewBox="0 0 42 42" id="dashicon"></svg></button>
  </div>
  <div class="filters" id="filters"></div>
</header>

<div id="board"><div id="binner">
  <div class="col" data-st="todo">
    <div class="colhead">К работе <span class="count" id="c-todo">0</span></div>
    <div class="drop" id="l-todo"></div>
  </div>
  <div class="col" data-st="doing">
    <div class="colhead">В работе <span class="count" id="c-doing">0</span></div>
    <div class="drop" id="l-doing"></div>
  </div>
  <div class="col" data-st="review">
    <div class="colhead">Ревью <span class="count" id="c-review">0</span></div>
    <div class="drop" id="l-review"></div>
  </div>
  <div class="col" data-st="done">
    <div class="colhead">Готово <span class="count" id="c-done">0</span></div>
    <div class="drop" id="l-done"></div>
  </div>
  <div class="col" data-st="closed">
    <div class="colhead">Проверено <span class="count" id="c-closed">0</span></div>
    <div class="drop" id="l-closed"></div>
  </div>
</div></div>

<div id="board2">
  <div class="nhead">
    <h2>Дашборд</h2>
    <button id="dclose">Закрыть</button>
  </div>
  <div class="dbody">
    <div class="dchips" id="dchips"></div>

  stroke-width="2" stroke-linecap="round"/></svg></button>

<script>
var VERSION='52';
var GIST_ID='aaac769d99c8e0106c01ee3763b9db36', FILE_NAME='tasks.json';
var API='https://api.github.com/gists/'+GIST_ID;
var data=null, base=null, dirty=false, openId=null, token=null, zoom=0;
var saving=false;                                    // одно сохранение за раз: автосейв не лезет поверх ручного
var F={stages:[], sections:[], backlog:false};
var BACKLOG='Бэклог';

function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function $(id){ return document.getElementById(id); }
var sayTimer=null;
function say(t,c,fade){
  clearTimeout(sayTimer);
  var s=$('status');
  s.textContent=t||''; s.className=c||'';
  s.style.display=t?'block':'none';
  if(t && fade) sayTimer=setTimeout(function(){ s.textContent=''; s.style.display='none'; },1600);
}
function busy(on){ var b=$('reload'); b.disabled=!!on; b.className=on?'busy':'ready'; }
function failed(){ $('reload').disabled=false; $('reload').className='fail'; }
function snap(o){ return JSON.parse(JSON.stringify(o)); }

// Гист один на двоих, и раньше сохранял его целиком тот, кто нажал последним —
// чужие правки при этом молча пропадали. Теперь берём свежий гист и переносим
// в него только то, что действительно изменили мы: сравниваем со снимком загрузки.
function mergeOnto(remote){
  if(!Array.isArray(remote.tasks)) return snap(data);
  if(!Array.isArray(remote.notes)) remote.notes=[];
  var rById={}, bById={};
  remote.tasks.forEach(function(t){ rById[t.id]=t; });
  (base.tasks||[]).forEach(function(t){ bById[t.id]=t; });

  data.tasks.forEach(function(lt){
    var rt=rById[lt.id], bt=bById[lt.id];
    if(!rt){ remote.tasks.push(snap(lt)); return; }   // карточка, которой в свежем нет
    if(!bt) return;                                    // не было на загрузке — не наше
    if(lt.status!==bt.status) rt.status=lt.status;
    (lt.checklist||[]).forEach(function(lc,i){
      var bc=(bt.checklist||[])[i], rc=(rt.checklist||[])[i];
      if(bc && rc && lc.done!==bc.done) rc.done=lc.done;
    });
    var lcm=lt.comments||[], bcm=bt.comments||[], rcm=rt.comments||[];
    var bIds={}, rIds={}, lIds={};
    bcm.forEach(function(c){ bIds[c.id]=1; });
    rcm.forEach(function(c){ rIds[c.id]=1; });
    lcm.forEach(function(c){ lIds[c.id]=1; });
    lcm.forEach(function(c){ if(!bIds[c.id] && !rIds[c.id]) rcm.push(snap(c)); });
    rt.comments=rcm.filter(function(c){ return !(bIds[c.id] && !lIds[c.id]); });
  });

  // Порядок несёт смысл: перенесённая карточка лежит сверху. Слияние берёт
  // задачи из свежего гиста, поэтому раскладываем их в нашем порядке.
  var order={}; data.tasks.forEach(function(t,i){ order[t.id]=i; });
  remote.tasks.sort(function(a,b){
    var ai=order[a.id], bi=order[b.id];
    if(ai===undefined && bi===undefined) return 0;
    if(ai===undefined) return 1;
    if(bi===undefined) return -1;
    return ai-bi;
  });

  var ln=data.notes||[], bn=base.notes||[], rn=remote.notes;
  var bn2={}, rn2={}, ln2={};
  bn.forEach(function(n){ bn2[n.id]=n; });
  rn.forEach(function(n){ rn2[n.id]=n; });
  ln.forEach(function(n){ ln2[n.id]=1; });
  ln.forEach(function(n){
    if(!bn2[n.id] && !rn2[n.id]) rn.push(snap(n));
    else if(rn2[n.id] && bn2[n.id] && n.done!==bn2[n.id].done) rn2[n.id].done=n.done;
  });
  remote.notes=rn.filter(function(n){ return !(bn2[n.id] && !ln2[n.id]); });
  return remote;
}

// Порядок карточек в массиве — это и есть порядок на доске. Перенесённая
// должна оказаться сверху, а не теряться в хвосте длинной колонки.
function bump(t){
  var i=data.tasks.indexOf(t);
  if(i > 0){ data.tasks.splice(i,1); data.tasks.unshift(t); }
}

function touch(){ dirty=true; $('save').disabled=false; $('nsave').disabled=false; }

/* ─────────── данные */
function gate(msg){
  $('gerr').textContent=msg||'';
  $('gate').classList.add('on');
  setTimeout(function(){ $('gtok').focus(); },50);
}

function load(){
  if(!token){ gate(); return; }
  busy(true); say('Обновляю…');
  fetch(API+'?t='+Date.now(), {cache:'no-store', headers:{Authorization:'token '+token}})
    .then(function(r){
      if(r.status===401||r.status===403) throw new Error('BADTOKEN');
      if(r.status===404) throw new Error('Гист не найден');
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(j){
      var f=j.files[FILE_NAME];
      if(!f) throw new Error('В гисте нет файла '+FILE_NAME);
      if(f.truncated) return fetch(f.raw_url,{cache:'no-store'}).then(function(r){ return r.text(); });
      return f.content;
    })
    .then(function(txt){
      if(txt===undefined) return;
      data=JSON.parse(txt);
      if(!Array.isArray(data.notes)) data.notes=[];
      base=snap(data);                       // снимок на момент загрузки — основа для слияния
      dirty=false; $('save').disabled=true; $('nsave').disabled=true;
      $('gate').classList.remove('on');
      buildFilters(); render(); renderNotes(); busy(false); say('Обновлено','ok',true);
    })
    .catch(function(e){
      if(e.message==='BADTOKEN'){ token=null; lsSet('gh_token',''); busy(false); gate('Токен не подошёл'); return; }
      failed(); say('Не загрузилось: '+e.message,'err');
    });
}

// reopen — id карточки, которую надо открыть заново после записи. Слияние возвращает
// свежее дерево объектов, и открытое окно осталось бы привязано к выброшенному:
// галочки в нём ставились бы в никуда.
function save(reopen){
  if(!data||!token||!base) return;
  if(saving) return;
  saving=true;
  $('save').disabled=true; say('Сохраняю…');
  fetch(API+'?t='+Date.now(),{cache:'no-store',headers:{Authorization:'token '+token}})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(j){
      var f=j.files[FILE_NAME];
      if(f.truncated) return fetch(f.raw_url,{cache:'no-store'}).then(function(r){ return r.text(); });
      return f.content;
    })
    .then(function(txt){
      var merged=mergeOnto(JSON.parse(txt));
      var d=new Date(), p2=function(n){ return (n<10?'0':'')+n; };
      merged.updated=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
      var body={}; body[FILE_NAME]={content:JSON.stringify(merged,null,2)+'\n'};
      return fetch(API,{method:'PATCH',headers:{Authorization:'token '+token,'Content-Type':'application/json'},
        body:JSON.stringify({files:body})})
        .then(function(r){ return r.json().then(function(x){ if(!r.ok) throw new Error(x.message||('HTTP '+r.status)); return merged; }); });
    })
    .then(function(merged){
      saving=false;
      data=merged; base=snap(merged);
      dirty=false; $('save').disabled=true; $('nsave').disabled=true;
      buildFilters(); render(); renderNotes();
      if($('board2').classList.contains('on')) renderDash();
      if(reopen && $('modal').classList.contains('on')) openTask(reopen);
      say('Сохранено','ok',true);
    })
    .catch(function(e){
      saving=false;
      if(/bad credentials|401|403/i.test(e.message)){ token=null; lsSet('gh_token',''); gate('Токен не подошёл'); return; }
      $('save').disabled=false; say('Не сохранилось: '+e.message,'err');
    });
}

/* ─────────── автосохранение
   Ручное «Сохранить» забывается: поработал, закрыл вкладку — и всё мимо гиста.
   Раз в минуту дописываем сами. Слияние на записи то же самое, так что параллельная
   работа с телефона по-прежнему не затирается. */
var AUTOSAVE_MS=60000;

function autosave(){
  if(!dirty || saving || !data || !token || !base) return;
  // Пока палец в поле ввода, набранного ещё нет в данных: перерисовка сотрёт текст
  var el=document.activeElement;
  if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')) return;
  save($('modal').classList.contains('on') ? openId : null);
}

/* ─────────── фильтры */
function closePops(){
  document.querySelectorAll('.fpop').forEach(function(p){ p.remove(); });
}

function dropdown(label, opts, sel){
  var g=document.createElement('div'); g.className='fg';
  var b=document.createElement('div'); b.className='fbtn';
  var cap=document.createElement('span');
  var car=document.createElement('span'); car.className='car'; car.textContent='▼';
  b.appendChild(cap); b.appendChild(car);

  function paint(){
    cap.textContent = sel.length ? label+' · '+sel.length : label;
    b.className='fbtn'+(sel.length?' on':'');
  }
  paint();

  b.onclick=function(e){
    e.stopPropagation();
    var mine=document.querySelector('.fpop[data-for="'+label+'"]');
    closePops();
    if(mine) return;                       // был открыт — просто закрыли

    var pop=document.createElement('div');
    pop.className='fpop on'; pop.dataset.for=label;
    pop.onclick=function(ev){ ev.stopPropagation(); };

    var cl=document.createElement('div'); cl.className='fclear';
    var all=document.createElement('div'); all.className='fopt';
    all.textContent='Показать все';
    all.onclick=function(){
      sel.length=0;
      pop.querySelectorAll('.fopt.sel').forEach(function(r){ r.classList.remove('sel'); });
      paint(); render();
    };
    cl.appendChild(all); pop.appendChild(cl);

    opts.forEach(function(o){
      var row=document.createElement('div');
      row.className='fopt'+(sel.indexOf(o)>=0?' sel':'');
      var tk=document.createElement('div'); tk.className='tick';
      var sp=document.createElement('span'); sp.textContent=o;
      row.appendChild(tk); row.appendChild(sp);
      row.onclick=function(){
        var i=sel.indexOf(o);
        if(i<0) sel.push(o); else sel.splice(i,1);
        row.classList.toggle('sel', sel.indexOf(o)>=0);
        paint(); render();                 // список остаётся открытым
      };
      pop.appendChild(row);
    });

    document.body.appendChild(pop);
    var r=b.getBoundingClientRect();
    var w=pop.offsetWidth;
    pop.style.left=Math.round(Math.max(8, Math.min(r.left, window.innerWidth-w-8)))+'px';
    pop.style.top=Math.round(r.bottom+6)+'px';
  };

  g.appendChild(b);
  return g;
}

function buildFilters(){
  closePops();
  var box=$('filters'); box.innerHTML='';
  var stages=[], secs=[];
  data.tasks.forEach(function(t){
    if(t.section===BACKLOG) return;
    if(t.stage!=='—' && stages.indexOf(t.stage)<0) stages.push(t.stage);
    if(secs.indexOf(t.section)<0) secs.push(t.section);
  });
  stages.sort();
  box.appendChild(dropdown('Этап', stages, F.stages));
  box.appendChild(dropdown('Раздел', secs, F.sections));

  var b=document.createElement('div'); b.className='fbtn'+(F.backlog?' on':'');
  b.textContent=BACKLOG;
  b.onclick=function(e){
    e.stopPropagation(); closePops();
    F.backlog=!F.backlog;
    b.className='fbtn'+(F.backlog?' on':'');
    render();
  };
  box.appendChild(b);
}

document.addEventListener('click', closePops);
window.addEventListener('resize', closePops);
$('filters').addEventListener('scroll', closePops);

function visible(t){
  if(F.backlog) return t.section===BACKLOG;
  if(t.section===BACKLOG) return false;
  if(F.stages.length && F.stages.indexOf(t.stage)<0) return false;
  if(F.sections.length && F.sections.indexOf(t.section)<0) return false;
  return true;
}

/* ─────────── отрисовка */
function render(){
  COLS.forEach(function(st){
    var box=$('l-'+st); box.innerHTML=''; var n=0;
    data.tasks.forEach(function(t){
      if(t.status!==st||!visible(t)) return;
      n++; box.appendChild(card(t));
    });
    $('c-'+st).textContent=n;
    if(!n){ var e=document.createElement('div'); e.className='empty'; e.textContent='пусто'; box.appendChild(e); }
  });
  var all=data.tasks.filter(function(t){ return t.stage!=='—'; });
  var dn=all.filter(function(t){ return DONEST[t.status]; }).length;
  $('total').textContent=dn+' / '+all.length;
  $('gbar').style.width=(all.length?dn/all.length*100:0)+'%';
}

function card(t){
  var el=document.createElement('div');
  el.className='card'; el.dataset.id=t.id;
  el.style.borderLeftColor=taskColor(t);
  var h=document.createElement('h3'); h.textContent=t.title; el.appendChild(h);

  var m=document.createElement('div'); m.className='meta';
  var s=document.createElement('span'); s.className='tag sec'; s.textContent=t.section; m.appendChild(s);
  if(t.stage!=='—'){ var g=document.createElement('span'); g.className='tag stage'; g.textContent=t.stage; m.appendChild(g); }
  t.disciplines.forEach(function(d){ var x=document.createElement('span'); x.className='tag'; x.textContent=d; m.appendChild(x); });
  el.appendChild(m);

  var blocked=t.checklist.some(function(c){
    return c.blockedBy && c.blockedBy.some(function(b){
      var bt=data.tasks.filter(function(x){ return x.id===b.id; })[0];
      return bt && !DONEST[bt.status];
    });
  });
  if(blocked){
    var wt=document.createElement('span'); wt.className='tag warn'; wt.textContent='! блокер';
    m.appendChild(wt);
  }

  if(t.comments && t.comments.length){
    var cm=document.createElement('span'); cm.className='tag'; cm.textContent='💬 '+t.comments.length;
    m.appendChild(cm);
  }

  if(t.checklist.length){
    var p=document.createElement('div'); p.className='prog';
    var dn=t.checklist.filter(function(c){ return c.done; }).length;
    var b=document.createElement('div'); b.className='bar';
    var i=document.createElement('i'); i.style.width=(dn/t.checklist.length*100)+'%'; b.appendChild(i);
    var lbl=document.createElement('span'); lbl.textContent=dn+'/'+t.checklist.length;
    p.appendChild(b); p.appendChild(lbl); el.appendChild(p);
  }

  el.addEventListener('pointerdown',function(e){ grab(e,el,t); });
  el.addEventListener('click',function(e){ cardTap(e,t.id); });
  return el;
}

/* ─────────── перетаскивание: мышью сразу, пальцем по долгому нажатию */
var drag=null, hold=null, moved=false, start=null, autoTimer=null, suppress=false;
var ZOOMK=0.62;

function grab(e,el,t){
  if(e.button===1||e.button===2) return;
  moved=false; suppress=false; start={x:e.clientX,y:e.clientY};
  var touchy=(e.pointerType==='touch'||e.pointerType==='pen');
  if(touchy){
    hold=setTimeout(function(){ begin(el,t,start.x,start.y,true); },320);
  } else {
    begin(el,t,start.x,start.y,false);   // мышью хватаем сразу, но клик не глушим
  }
}

function begin(el,t,x,y,byHold){
  hold=null;
  if(tapTimer){ clearTimeout(tapTimer); tapTimer=null; }
  var r=el.getBoundingClientRect();
  var k=(window.innerWidth<=820) ? curK : 1;
  var ghost=el.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.style.width=(r.width/k)+'px';
  ghost.style.left=r.left+'px';
  ghost.style.top=r.top+'px';
  if(k!==1){ ghost.style.transformOrigin='0 0'; ghost.style.transform='scale('+k+') rotate(1.5deg)'; }
  document.body.appendChild(ghost);
  el.classList.add('dragging');
  document.body.classList.add('dragging');
  drag={t:t, el:el, ghost:ghost, dx:x-r.left, dy:y-r.top, byHold:!!byHold};
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(err){}
}

// раньше искали колонку под точкой, и короткая колонка кончалась выше пальца —
// уронить в неё было нельзя. Теперь смотрим только на горизонталь: вся полоса колонки ловит
function colAt(x,y){
  var cols=document.querySelectorAll('.col');
  if(!cols.length) return null;
  var board=$('board').getBoundingClientRect();
  if(y<board.top-40) return null;                   // выше доски — не бросаем
  var best=null, dmin=Infinity;
  for(var i=0;i<cols.length;i++){
    var r=cols[i].getBoundingClientRect();
    if(x>=r.left && x<=r.right) return cols[i];
    var d=(x<r.left) ? r.left-x : x-r.right;        // между колонками — ближайшая
    if(d<dmin){ dmin=d; best=cols[i]; }
  }
  return best;
}

function edgeScroll(x){
  var b=$('board');
  if(window.innerWidth>820) return;
  clearInterval(autoTimer);
  var d=0;
  if(x<64) d=-18; else if(x>window.innerWidth-64) d=18;
  if(d) autoTimer=setInterval(function(){ b.scrollLeft+=d; },16);
}

document.addEventListener('pointermove',function(e){
  if(!drag){
    // палец поехал — это прокрутка, а не тап: снимаем захват и глушим клик
    if(start && Math.hypot(e.clientX-start.x, e.clientY-start.y)>9){
      if(hold){ clearTimeout(hold); hold=null; }
      moved=true;
    }
    return;
  }
  moved=true;
  drag.ghost.style.left=(e.clientX-drag.dx)+'px';
  drag.ghost.style.top=(e.clientY-drag.dy)+'px';
  var col=colAt(e.clientX,e.clientY);
  document.querySelectorAll('.col').forEach(function(c){ c.classList.toggle('over', c===col); });
  edgeScroll(e.clientX);
});

document.addEventListener('touchmove',function(e){ if(drag) e.preventDefault(); }, {passive:false});

function drop(e){
  if(hold){ clearTimeout(hold); hold=null; }
  clearInterval(autoTimer);
  if(moved || (drag && drag.byHold)) suppress=true;   // зажал пальцем и передумал — не открываем
  if(!drag){ start=null; return; }
  var col=colAt(e.clientX,e.clientY);
  if(col && drag.t.status!==col.dataset.st){ drag.t.status=col.dataset.st; bump(drag.t); touch(); }
  drag.ghost.remove();
  drag.el.classList.remove('dragging');
  document.body.classList.remove('dragging');
  document.querySelectorAll('.col').forEach(function(c){ c.classList.remove('over'); });
  drag=null; start=null;
  render();
}
document.addEventListener('pointerup',drop);
document.addEventListener('pointercancel',drop);

/* ─────────── карточка */
function openTask(id){
  openId=id;
  var t=data.tasks.filter(function(x){ return x.id===id; })[0];
  $('m-title').textContent=t.title;
  var m=$('m-meta'); m.innerHTML='';
  var s=document.createElement('span'); s.className='tag sec'; s.textContent=t.section; m.appendChild(s);
  if(t.stage!=='—'){ var g=document.createElement('span'); g.className='tag'; g.textContent=t.stage; m.appendChild(g); }
  t.disciplines.forEach(function(d){ var x=document.createElement('span'); x.className='tag'; x.textContent=d; m.appendChild(x); });

  var b=$('m-body'); b.innerHTML='';
  if(!t.checklist.length){
    var e=document.createElement('div'); e.className='empty';
    e.textContent='Без подпунктов — просто сделать и перетащить в «Готово».'; b.appendChild(e);
  }
  t.checklist.forEach(function(c){
    var row=document.createElement('div'); row.className='chk'+(c.done?' done':'');
    var box=document.createElement('div'); box.className='box';
    var sp=document.createElement('span'); sp.textContent=c.text;
    row.appendChild(box); row.appendChild(sp);

    // блокеры: чего не хватает, чтобы этот пункт вообще можно было закрыть
    var blk=null;
    if(c.blockedBy && c.blockedBy.length){
      var deps=c.blockedBy.map(function(b){
        var bt=data.tasks.filter(function(x){ return x.id===b.id; })[0];
        return {t:bt, why:b.why};
      }).filter(function(d){ return d.t; });
      if(deps.length){
        var solved=deps.every(function(d){ return DONEST[d.t.status]; });
        var w=document.createElement('div');
        w.className='warn'+(solved?' ok':''); w.textContent=solved?'✓':'!';
        w.title=solved?'Блокер снят':'Есть блокер';
        row.appendChild(w);

        blk=document.createElement('div'); blk.className='blk'+(solved?' done':'');
        var hh=document.createElement('h5');
        hh.textContent=solved?'Блокер снят':'Сначала нужно закрыть';
        blk.appendChild(hh);
        deps.forEach(function(d){
          var bt=document.createElement('div'); bt.className='bt';
          var st=document.createElement('div'); st.className='st';
          st.style.background='var('+STCOL[d.t.status]+')';
          var tt=document.createElement('div'); tt.className='tt'; tt.textContent=d.t.title;
          var sg=document.createElement('div'); sg.className='sg'; sg.textContent=d.t.stage;
          bt.appendChild(st); bt.appendChild(tt); bt.appendChild(sg);
          bt.onclick=function(ev){ ev.stopPropagation(); openTask(d.t.id); };
          blk.appendChild(bt);
          if(d.why){
            var wy=document.createElement('p'); wy.className='why'; wy.textContent=d.why;
            blk.appendChild(wy);
          }
        });
        w.onclick=function(e){
          e.stopPropagation();
          var on=blk.classList.toggle('on');
          w.classList.toggle('on', on);
        };
      }
    }

    var hint=null;
    if(c.hint){
      var inf=document.createElement('div'); inf.className='info'; inf.textContent='i';
      row.appendChild(inf);
      hint=document.createElement('div'); hint.className='hint'; hint.textContent=c.hint;
      inf.onclick=function(e){
        e.stopPropagation();
        var on=hint.classList.toggle('on');
        inf.classList.toggle('on', on);
      };
    }

    row.onclick=function(){
      c.done=!c.done; touch();
      row.classList.toggle('done', c.done);
      // Галочки сами везут карточку: первая — в работу, последняя — в готово.
      // Из «на ревью» первой галочкой не тянем назад — там карточка уже дальше по пути.
      if(c.done && t.checklist.every(function(x){ return x.done; }) && !DONEST[t.status]) { t.status='done'; bump(t); }
      else if(c.done && t.status==='todo') { t.status='doing'; bump(t); }
      else if(!c.done && DONEST[t.status]) { t.status='doing'; bump(t); }
      render();
    };
    b.appendChild(row);
    if(blk) b.appendChild(blk);
    if(hint) b.appendChild(hint);
  });

  if(!Array.isArray(t.comments)) t.comments=[];
  var sec=document.createElement('div'); sec.className='csec';

  h.textContent='Комментарии'+(t.comments.length?' · '+t.comments.length:'');
  sec.appendChild(h);

  // Поле ввода сверху, а сообщения под ним свежими вперёд — как карточка,
  // которая ложится первой в колонке. Раньше и то и другое уезжало вниз,
  // и до поля приходилось мотать через всю переписку.
  var add=document.createElement('div'); add.className='cadd';
  var ta=document.createElement('textarea'); ta.placeholder='Что заметил по этой задаче…';
  var btn=document.createElement('button'); btn.className='primary'; btn.textContent='Добавить';
  function post(){
    var v=ta.value.trim(); if(!v) return;
    var d=new Date(), p2=function(n){ return (n<10?'0':'')+n; };
    t.comments.push({ id:'c'+Date.now(), text:v,
      ts:p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes()) });
    ta.value=''; touch(); cTouched=true; openTask(id);
  }
  btn.onclick=post;
  ta.addEventListener('keydown',function(e){ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) post(); });
  add.appendChild(ta); add.appendChild(btn);
  sec.appendChild(add);

  t.comments.slice().reverse().forEach(function(c){
    var box=document.createElement('div'); box.className='cm';
    var bd=document.createElement('div'); bd.className='body';
    var p=document.createElement('p'); p.textContent=c.text;
    var tm=document.createElement('time'); tm.textContent=c.ts||'';
    bd.appendChild(p); bd.appendChild(tm);
    var d=document.createElement('div'); d.className='del'; d.textContent='🗑';
    d.onclick=function(){
      t.comments.splice(t.comments.indexOf(c),1);
      touch(); cTouched=true; openTask(id);
    };
    box.appendChild(bd); box.appendChild(d);
    sec.appendChild(box);
  });

  b.appendChild(sec);

  $('modal').classList.add('on');
}

var PAL=['#4f8cff','#3fbf6a','#e0a33e','#e05c5c','#8b7fd6','#3fb8bf','#d67fb0','#7fbf3f',
         '#bf7f3f','#5f7fd6','#bf3f7f','#3fbf9f','#9f9f3f','#7f5fbf','#d6613f','#4fb0ff','#a0a8b8'];
var SYSCOL={
  'Контент':'#4f8cff', 'Бой и мир':'#3fbf6a', 'Релиз':'#e0a33e', 'Интерфейс':'#e05c5c',
  'Боссы':'#8b7fd6', 'Звук':'#3fb8bf', 'Мета и деньги':'#d67fb0', 'Техника':'#7fbf3f',
  'Бэклог':'#6b7280'
};
// цвет раздела — оттенок его системы: тот же тон, разная светлота,
// чтобы родство читалось, но ни один не проваливался в грязь
function toHsl(hex){
  var n=parseInt(hex.slice(1),16), r=((n>>16)&255)/255, g=((n>>8)&255)/255, b=(n&255)/255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0, l=(mx+mn)/2;
  var sat=d===0?0:d/(1-Math.abs(2*l-1));
  if(d){
    if(mx===r) h=60*(((g-b)/d)%6);
    else if(mx===g) h=60*((b-r)/d+2);
    else h=60*((r-g)/d+4);
  }
  return [(h+360)%360, sat, l];
}
function toHex(h,sa,l){
  var c=(1-Math.abs(2*l-1))*sa, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, t;
  if(h<60) t=[c,x,0]; else if(h<120) t=[x,c,0]; else if(h<180) t=[0,c,x];
  else if(h<240) t=[0,x,c]; else if(h<300) t=[x,0,c]; else t=[c,0,x];
  return '#'+t.map(function(v){
    return Math.round((v+m)*255).toString(16).padStart(2,'0');
  }).join('');
}
var SECCOL={}, LSTEP=[0, 0.13, -0.09, 0.24, -0.16, 0.34];
var SHORT={'Мета и деньги':'Мета', 'Бой и мир':'Бой', 'Производительность':'Кадры'};
function shortName(n){ return SHORT[n] || n; }
function secColor(sec){
  if(SECCOL[sec]) return SECCOL[sec];
  var sys=SYS[sec]||sec, base=SYSCOL[sys]||'#6b7280';
  var sibs=Object.keys(SYS).filter(function(k){ return SYS[k]===sys; }).sort();
  var i=Math.max(0, sibs.indexOf(sec));
  var c=toHsl(base);
  var l=Math.min(0.76, Math.max(0.40, c[2] + (LSTEP[i%LSTEP.length]||0)));
  SECCOL[sec]=toHex(c[0], c[1], l);
  return SECCOL[sec];
}
function taskColor(t){ return SYSCOL[SYS[t.section]||t.section] || '#6b7280'; }
var dStage=null, dOpen=null, dMode='sys', dFocus=null;
var cTouched=false;
var SYS={
  'Арт':'Контент', 'Анимация':'Контент', 'Эффекты':'Контент', 'Нарратив':'Контент',
  'Геймплей':'Бой и мир', 'Противники':'Бой и мир', 'Мир':'Бой и мир',
  'Тестирование':'Релиз', 'Производительность':'Релиз', 'Аналитика':'Релиз',
  'Настройки':'Релиз', 'Публикация':'Релиз',
  'Мета':'Мета и деньги', 'Экономика':'Мета и деньги', 'Прогресс':'Мета и деньги',
  'Звук':'Звук', 'Вибрация':'Звук',
  'Под капотом':'Техника', 'Обвязка':'Техника',
  'Интерфейс':'Интерфейс', 'Боссы':'Боссы'
};
function groupOf(t){ return dMode==='sys' ? (SYS[t.section]||t.section) : t.section; }
var COLS=['todo','doing','review','done','closed'];
var DONEST={done:1, closed:1};                       // что считается закрытым
var STCOL={todo:'--bl', doing:'--warn', review:'--e3', done:'--ok', closed:'--ok'};
var STNAME={todo:'к работе', doing:'в работе', review:'на ревью', done:'готово', closed:'проверено'};

// вес задачи — число подпунктов: так «Семь раскрасок» весит больше, чем «Смерть игрока»
function weigh(t){
  var n=t.checklist.length;
  if(!n) return {all:1, done:DONEST[t.status]?1:0};
  var d=0; t.checklist.forEach(function(c){ if(c.done) d++; });
  if(DONEST[t.status]) d=n;
  return {all:n, done:d};
}

function dashData(){
  var by={}, all=0, done=0;
  data.tasks.forEach(function(t){
    if(t.section===BACKLOG) return;
    if(dStage && t.stage!==dStage) return;
    var w=weigh(t), g=groupOf(t);
    if(!by[g]) by[g]={all:0,done:0};
    by[g].all+=w.all; by[g].done+=w.done;
    all+=w.all; done+=w.done;
  });
  var left=all-done;
  var rows=Object.keys(by).map(function(k){
    var rest=by[k].all-by[k].done;
    return {name:k, all:by[k].all, done:by[k].done, rest:rest,
            share: left ? rest/left : 0};
  }).sort(function(a,b){ return b.rest-a.rest || b.all-a.all; });
  rows.forEach(function(r){
    r.color = dMode==='sys' ? (SYSCOL[r.name]||'#6b7280') : secColor(r.name);
  });
  return {rows:rows, all:all, done:done, left:all-done};
}

function renderDash(){
  if(!data) return;
  var d=dashData();

  var chips=$('dchips'); chips.innerHTML='';
  var stages=[]; 
  data.tasks.forEach(function(t){
    if(t.section!==BACKLOG && t.stage!=='—' && stages.indexOf(t.stage)<0) stages.push(t.stage);
  });
  stages.sort();
  [null].concat(stages).forEach(function(v){
    var c=document.createElement('div');
    c.className='fbtn'+(dStage===v?' on':'');
    c.textContent=v||'Всё';
    c.onclick=function(){ dStage=v; dOpen=null; dFocus=null; renderDash(); };
    chips.appendChild(c);
  });

  var seg=$('dmode'); seg.innerHTML='';
  [['sys','Системы'],['sec','Разделы']].forEach(function(m){
    var e=document.createElement('div');
    e.className=(dMode===m[0]?'on':''); e.textContent=m[1];
    e.onclick=function(){ if(dMode===m[0]) return; dMode=m[0]; dOpen=null; dFocus=null; renderDash(); };
    seg.appendChild(e);
  });

  var pct=d.all?Math.round(d.done/d.all*100):0;   // в центре — пройденный путь
  var svg='<svg class="donut" viewBox="-15 -2 72 46">';
  svg+='<circle cx="21" cy="21" r="15.915" fill="none" stroke="#232733" stroke-width="5.5"/>';
  var off=0, labels='';
  d.rows.forEach(function(r){
    var len=r.share*100;
    if(len<=0) return;
    svg+='<circle class="sl" data-g="'+r.name.replace(/"/g,'')+'" cx="21" cy="21" r="15.915"'
       +' fill="none" stroke="'+r.color+'" stroke-width="5.5"'
       +' stroke-dasharray="'+len.toFixed(2)+' '+(100-len).toFixed(2)+'"'
       +' stroke-dashoffset="'+(25-off).toFixed(2)+'"/>';
    if(len>=6){                                  // мелкие не подписываем — иначе каша
      var a=(-90+(off+len/2)*3.6)*Math.PI/180;
      var cx=Math.cos(a), cy=Math.sin(a);
      var right=cx>=0;
      labels+='<line class="lead" x1="'+(21+cx*19).toFixed(2)+'" y1="'+(21+cy*19).toFixed(2)+'"'
            +' x2="'+(21+cx*22.5).toFixed(2)+'" y2="'+(21+cy*22.5).toFixed(2)+'"'
            +' stroke="'+r.color+'"/>';
      labels+='<text class="lbl" x="'+(21+cx*22.5+(right?1:-1)).toFixed(2)+'"'
            +' y="'+(21+cy*22.5).toFixed(2)+'" fill="'+r.color+'"'
            +' text-anchor="'+(right?'start':'end')+'" dominant-baseline="middle">'
            +shortName(r.name)+'</text>';
    }
    off+=len;
  });
  svg+=labels;
  svg+='<text class="dmid" x="21" y="21" text-anchor="middle" dominant-baseline="central"'
     +' style="font-size:8.5px">'+pct+'%</text>';
  svg+='</svg>';
  svg+='<div class="dcap">осталось <b>'+d.left+'</b> из '+d.all+' подпунктов</div>';
  $('dchart').innerHTML=svg;
  $('dchart').querySelectorAll('circle.sl').forEach(function(c){
    c.onclick=function(){ dFocus=c.dataset.g; dOpen=c.dataset.g; renderDash(); };
  });

  var lg=$('dlegend'); lg.innerHTML='';
  var rows=d.rows;
  if(dFocus){
    var only=d.rows.filter(function(r){ return r.name===dFocus; });
    if(only.length){
      rows=only;
      var back=document.createElement('div'); back.className='dback';
      var b=document.createElement('button'); b.textContent='← Все системы';
      b.onclick=function(){ dFocus=null; dOpen=null; renderDash(); };
      back.appendChild(b);
      lg.appendChild(back);
    } else { dFocus=null; }
  }
  rows.forEach(function(r){
    var open=(dOpen===r.name);
    var row=document.createElement('div');
    row.className='lrow'+(open?' open':'')+(r.rest?'':' empty');
    var dot=document.createElement('div'); dot.className='ldot'; dot.style.background=r.color;
    var nm=document.createElement('div'); nm.className='lname'; nm.textContent=r.name;
    var sh=document.createElement('div'); sh.className='lpct';
    // Закрытая система показывает 100%, а не свои 0% доли остатка. Формально это
    // другая величина, но ноль напротив полной полоски читается как «не сделано
    // ничего», хотя всё ровно наоборот.
    //
    // А у незакрытой ноль вообще не должен появляться: теперь он означает «готово»,
    // и система с последним несделанным пунктом (при трёх сотнях остатка это 0.3%)
    // выглядела бы закрытой. Поэтому там, где округление даёт ноль, показываем
    // десятую долю процента, а совсем мелкое — как «меньше 0.1».
    var p = r.share*100;
    sh.textContent = !r.rest      ? '100%'
                   : Math.round(p) ? Math.round(p)+'%'
                   : (p>=0.05 ? p.toFixed(1) : '<0.1')+'%';
    var bar=document.createElement('div'); bar.className='lbar';
    var fill=document.createElement('i');

    if(!open) return;
    var sub=document.createElement('div'); sub.className='lsub';
    var list=data.tasks.filter(function(t){
      return t.section!==BACKLOG && groupOf(t)===r.name && (!dStage || t.stage===dStage);
    });
    var ord={doing:0, review:1, todo:2, done:3, closed:4};
    list.sort(function(a,b){ return ord[a.status]-ord[b.status]; });
    list.forEach(function(t){
      var w=weigh(t);
      var it=document.createElement('div'); it.className='lt'+(DONEST[t.status]?' done':'');
      var st=document.createElement('div'); st.className='st';
      st.style.background='var('+STCOL[t.status]+')';
      st.title=STNAME[t.status];
      var tt=document.createElement('div'); tt.className='tt'; tt.textContent=t.title;
      var sg=document.createElement('div'); sg.className='sg'; sg.textContent=t.stage;
      var cn=document.createElement('div'); cn.className='cnt'; cn.textContent=w.done+'/'+w.all;
      it.appendChild(st); it.appendChild(tt);
      if(dMode==='sys' && t.section!==r.name){
        var sc=document.createElement('div'); sc.className='sc'; sc.textContent=t.section;
        it.appendChild(sc);
      }
      it.appendChild(sg); it.appendChild(cn);
      it.onclick=function(e){ e.stopPropagation(); openTask(t.id); };
      sub.appendChild(it);
    });
    lg.appendChild(sub);
  });

  $('dnote').textContent='В кольце — только оставшаяся работа: доля показывает, '+
    'какую часть остатка занимает система, а закрытая показывает 100%. Полоска и число справа — сколько '+
    'в ней уже закрыто. Нажми на сектор кольца, чтобы провалиться в его задачи. Бэклог не учитывается. '+
    (dMode==='sys'
      ? 'Системы — это склеенные разделы: так в кольце восемь долей вместо двадцати одной. Переключись на «Разделы» для полной картины.'
      : 'Полная разбивка по разделам. Переключись на «Системы», если долей слишком много.')+
    ' Нажми на строку, чтобы увидеть задачи: одна система обычно идёт сразу в нескольких этапах.';
}

var archOpen=false, trash=null;

function noteRow(n){
  var el=document.createElement('div');
  el.className='note'+(n.done?' done':'');
  var box=document.createElement('div'); box.className='box';
  var p=document.createElement('p'); p.textContent=n.text;
  box.onclick=function(){ n.done=!n.done; touch(); renderNotes(); };
  el.appendChild(box); el.appendChild(p);
  var d=document.createElement('div'); d.className='del'; d.textContent='🗑';
  d.onclick=function(){
    var i=data.notes.indexOf(n);
    trash={note:n, at:i};
    data.notes.splice(i,1); touch(); renderNotes();
  };
  el.appendChild(d);
  return el;
}

function renderNotes(){
  if(!data) return;
  var box=$('nbody'); box.innerHTML='';

  if(trash){
    var u=document.createElement('div'); u.className='undo';
    var p=document.createElement('p'); p.textContent='Удалено: '+trash.note.text;
    var b=document.createElement('button'); b.textContent='Вернуть';
    b.onclick=function(){
      data.notes.splice(Math.min(trash.at, data.notes.length), 0, trash.note);
      trash=null; touch(); renderNotes();
    };
    u.appendChild(p); u.appendChild(b); box.appendChild(u);
  }

  var live=data.notes.filter(function(n){ return !n.done; });
  var arch=data.notes.filter(function(n){ return n.done; });

  if(!live.length){
    var e=document.createElement('div'); e.className='nempty';
    e.textContent='Пусто. Запиши сюда всё, что жалко забыть.';
    box.appendChild(e);
  }
  live.forEach(function(n){ box.appendChild(noteRow(n)); });

  if(arch.length){
    var h=document.createElement('div'); h.className='nsect';
    var car=document.createElement('span'); car.className='car'; car.textContent=archOpen?'▼':'▶';
    var t=document.createElement('span'); t.textContent='Архив · '+arch.length;
    h.appendChild(car); h.appendChild(t);
    h.onclick=function(){ archOpen=!archOpen; renderNotes(); };
    box.appendChild(h);
    if(archOpen) arch.forEach(function(n){ box.appendChild(noteRow(n)); });
  }

  var dot=$('fabdot');
  dot.textContent=live.length;
  dot.classList.toggle('on', live.length>0);
}

function addNote(){
  var v=$('ntext').value.trim();
  if(!v || !data) return;
  data.notes.unshift({id:'n'+Date.now(), text:v, done:false});
  $('ntext').value=''; touch(); renderNotes();
}

$('fab').onclick=function(){
  if(!data) return;
  $('notes').classList.add('on'); renderNotes();
};
function closeNotes(){
  $('notes').classList.remove('on');
  trash=null;
  if(dirty) save();          // закрыл — сохранилось само
}
$('nclose').onclick=closeNotes;
$('nsave').onclick=function(){ save(); };
$('nadd').onclick=addNote;
$('ntext').addEventListener('keydown',function(e){ if(e.key==='Enter') addNote(); });

var zAnim=null, curK=1;

// масштабируем трансформацией, а не zoom: zoom пересобирает вёрстку,
// и заголовки карточек перескакивали со строки на строку прямо по ходу
function applyScale(k){
  var inner=$('binner'), b=$('board');
  curK=k;
  if(k===1){
    inner.style.transform=''; inner.style.marginRight=''; inner.style.marginBottom='';
    b.classList.remove('scaled');
    return;
  }
  var w=inner.offsetWidth, h=inner.offsetHeight;
  inner.style.transform='scale('+k+')';
  // коробка остаётся прежней, поэтому подрезаем её отрицательными полями,
  // иначе прокрутка уезжает в пустоту
  inner.style.marginRight=(-w*(1-k))+'px';
  inner.style.marginBottom=(-h*(1-k))+'px';
  b.classList.add('scaled');
}

function setZoom(to){
  if(Math.abs(curK-to)<0.001) return;
  if(zAnim) cancelAnimationFrame(zAnim);
  var from=curK, t0=performance.now(), dur=240;
  function step(now){
    var p=Math.min(1,(now-t0)/dur);
    var e=p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;      // мягкий разгон и торможение
    applyScale(from+(to-from)*e);
    if(p<1) zAnim=requestAnimationFrame(step);
    else { zAnim=null; applyScale(to); }
  }
  zAnim=requestAnimationFrame(step);
}

function toggleZoom(){
  if(window.innerWidth>820) return;
  zoom=(zoom+1)%2;
  setZoom(zoom?ZOOMK:1);
  $('zoombtn').classList.toggle('on', !!zoom);
}
$('zoombtn').onclick=function(e){ e.stopPropagation(); toggleZoom(); };

var tapT=0, tapX=0, tapY=0, tapTimer=null;
function cardTap(e,id){
  if(suppress){ suppress=false; return; }
  if(window.innerWidth>820){ openTask(id); return; }   // мышью открываем сразу
  var now=Date.now();
  if(tapTimer && now-tapT<320 && Math.hypot(e.clientX-tapX,e.clientY-tapY)<40){
    clearTimeout(tapTimer); tapTimer=null; tapT=0;
    toggleZoom();                                       // второй тап — масштаб
    return;
  }
  tapT=now; tapX=e.clientX; tapY=e.clientY;
  if(tapTimer) clearTimeout(tapTimer);
  // ждём, не придёт ли второй тап; иначе первый успел бы открыть карточку
  tapTimer=setTimeout(function(){ tapTimer=null; openTask(id); },230);
}

var lastTap=0;
$('board').addEventListener('click',function(e){
  if(e.target.closest('.card')) return;
  if(window.innerWidth>820) return;
  var now=Date.now();
  if(now-lastTap<330){ toggleZoom(); lastTap=0; }
  else lastTap=now;
});

setInterval(autosave, AUTOSAVE_MS);

// Уход со страницы. Вкладку прячут не только закрытием — переключение вкладки,
// сворачивание, блокировка экрана телефона дают то же событие, и это единственный
// момент, когда браузер ещё разрешает начать запрос.
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden') autosave();
});

$('ver').textContent='сборка '+VERSION;
token=ls('gh_token')||null;
load();
</script>
</body>
