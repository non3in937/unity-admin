<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unity Config Admin PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { background: #1e1e1e; color: #d4d4d4; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .panel { background: #2d2d30; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #3e3e42; position: relative; }
        .drag-handle { cursor: grab; padding: 10px; color: #569cd6; font-size: 20px; display: flex; align-items: center; justify-content: center; background: #3e3e42; border-radius: 4px; margin-right: 15px;}
        h2 { color: #569cd6; text-align: center; margin-bottom: 10px; }
        h3 { color: #4ec9b0; margin: 0; }
        label { display: block; margin-bottom: 5px; font-size: 11px; color: #9cdcfe; white-space: nowrap; }
        input, select { background: #3e3e42; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 13px;}
        select { cursor: pointer; appearance: none; }
        
        .btn-main { background: #238636; color: white; width: 100%; padding: 15px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; font-size: 16px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.2s;}
        .btn-main:hover { background: #2ea043; }

        .btn-undo { background: #c586c0; color: white; width: 100%; padding: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; font-size: 15px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(197, 134, 192, 0.3); display: none; transition: transform 0.1s;}
        .btn-undo:active { transform: scale(0.98); }

        .tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px; background: #2d2d30; color: #888; border: none; cursor: pointer; border-radius: 4px 4px 0 0; min-width: 80px;}
        .tab-btn.active { background: #1e1e1e; color: #fff; border-bottom: 3px solid #4ec9b0; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .row { display: flex; gap: 10px; align-items: flex-start; }
        .header-row { display: flex; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #3e3e42; padding-bottom: 10px; }
        .btn-add { background: #1f6b35; color: white; width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: bold;}
        .btn-remove { background: #8a2a2a; color: white; padding: 8px; border: none; border-radius: 4px; cursor: pointer; }
        .status { text-align: center; font-weight: bold; margin-bottom: 15px; }
        
        .backup-btn { background: #0e639c; color: white; width: 100%; padding: 15px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; font-size: 16px; margin-bottom: 20px;}
        .file-input-wrapper { background: #1e1e1e; border: 1px dashed #ce9178; padding: 20px; text-align: center; border-radius: 8px; margin-top: 10px;}

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .upgrade-card { background: #252526; border: 2px solid #3e3e42; border-radius: 12px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; }
        .upgrade-card:hover { transform: translateY(-3px); }
        .upgrade-card.disabled { opacity: 0.6; border-color: #555 !important; }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3e3e42; padding-bottom: 10px; margin-bottom: 15px; }
        .card-title { font-size: 16px; font-weight: bold; color: #4ec9b0; margin: 0; display: flex; align-items: center; gap: 8px; }
        .card-levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-levels .full-width { grid-column: span 2; }
        .card-levels label { color: #dcdcaa; }

        .preview-box { background: #1e1e1e; border-radius: 4px; padding: 10px; margin-top: 10px; font-size: 12px; color: #888; line-height: 1.5; border-left: 3px solid #4ec9b0; }
        .preview-box b { color: #dcdcaa; }
        .test-base-input { border: 1px dashed #dcdcaa !important; background: #252526 !important; margin-bottom: 15px !important;}
        
        .player-card { border-color: #4ec9b0; } .player-card:hover { border-color: #72ebd1; }
        .weapon-card { border-color: #ce9178; } .weapon-card .card-title { color: #ce9178; } .weapon-card:hover { border-color: #e5a489; }
        .upgrade-card:not(.player-card):not(.weapon-card):not(.evo-card) { border-color: #569cd6; } .upgrade-card:not(.player-card):not(.weapon-card):not(.evo-card):hover { border-color: #7abaff; }
        
        .evo-card { background: #201a23; }
        .recipe-badge { background: rgba(0,0,0,0.3); padding: 5px; border-radius: 4px; margin-bottom: 10px; text-align: center; font-size: 11px; color: #9cdcfe; }
        .evo-ac { border-color: #4fc1ff; } .evo-ac .card-title { color: #4fc1ff; } .evo-ac:hover { border-color: #8ce1ff; }
        .evo-hs { border-color: #dcdcaa; } .evo-hs .card-title { color: #dcdcaa; } .evo-hs:hover { border-color: #f5f5c3; } 
        .evo-ld { border-color: #b5cea8; } .evo-ld .card-title { color: #b5cea8; } .evo-ld:hover { border-color: #d2ecc5; } 
        .evo-hm { border-color: #c586c0; } .evo-hm .card-title { color: #c586c0; } .evo-hm:hover { border-color: #e7a1e1; } 
        .evo-tk { border-color: #f48771; } .evo-tk .card-title { color: #f48771; } .evo-tk:hover { border-color: #ffaa96; } 

        .folder-container { transition: all 0.3s ease; }
        .folder-container.disabled-folder { opacity: 0.5; }
        .folder-content { min-height: 20px; }

        /* 🔥 СТИЛИ БОССОВ 🔥 */
        .boss-card { border-color: #f48771; }
        .phase-card { background: #1e1e1e; border-left: 3px solid #c586c0; margin-top: 10px; padding: 10px; border-radius: 4px; border-top: 1px solid #333; border-right: 1px solid #333; border-bottom: 1px solid #333;}
        .attack-card { background: #252526; border: 1px dashed #569cd6; margin-top: 10px; padding: 10px; border-radius: 4px; }
        
        .revert-btn {
            position: absolute; right: 5px;
            background: #3a3a3d; color: #dcdcaa; border: 1px solid #5a5a5e;
            border-radius: 4px; font-size: 10px; line-height: 1; padding: 0 6px;
            cursor: pointer; max-width: 60%; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .revert-btn:active { background: #4a4a4d; }

        .last-edited-mark {
            margin-left: auto; font-size: 10px; color: #6b6b6b; white-space: nowrap;
            border: 1px solid #3e3e42; border-radius: 10px; padding: 2px 7px;
        }

        /* ── Узкий экран ──────────────────────────────────────────────
           Раньше медиазапросов не было вовсе: на десктопе всё «складывалось»
           просто потому, что flex-строки сжимаются, а телефон без meta viewport
           рисовал страницу в виртуальные ~980px и уменьшал целиком.
           Теперь ширина настоящая, и строки надо переносить, а не давить. */
        @media (max-width: 640px) {
            body { padding: 10px; }
            .panel { padding: 10px; }
            .upgrade-card { padding: 12px; }

            /* Полям в строках проставлен inline style="flex:1" — с basis 0 они
               никогда не переносятся, а бесконечно ужимаются. Перебить инлайн
               можно только !important: даём каждому полю минимум 140px, дальше
               строка переносится сама (обычно два поля в ряд). */
            .row { flex-wrap: wrap; }
            .row > * { flex: 1 1 140px !important; min-width: 140px; }

            /* Подписи вроде «Крит за ур. Рикошета (%)» в одну строку не влезают */
            label { white-space: normal; }

            /* iOS Safari принудительно зумит страницу при фокусе на поле мельче
               16px — это и есть тот прыжок вёрстки при тапе по инпуту */
            input, select, textarea { font-size: 16px; }

            .tabs { gap: 4px; }
            .tab-btn { min-width: 0; flex: 1 1 30%; padding: 10px 4px; font-size: 13px; }

            .cards-grid { grid-template-columns: 1fr; gap: 12px; }

            /* Вложенность босс → фаза → атака съедала ширину отступами */
            .phase-card, .attack-card { padding: 8px; }

            .btn-main, .backup-btn { padding: 14px; font-size: 15px; }
            h2 { font-size: 20px; }
        }

        /* Совсем узкие телефоны (iPhone SE ~320px). Строки полей отдельно
           ужимать не нужно: flex-basis 140px переносит их сам, когда два поля
           перестают влезать. Раньше здесь стоял принудительный 100% на 380px —
           и на распространённых 375px поля вставали по одному, хотя два
           помещались свободно. */
        @media (max-width: 340px) {
            .card-levels { grid-template-columns: 1fr; }
            .card-levels .full-width { grid-column: span 1; }
        }

        /* 🔥 НОВЫЕ СТИЛИ ПОДСКАЗОК ДЛЯ МОБИЛЬНЫХ 🔥 */
        .hint-text { 
            background-color: #1e1e1e; 
            border-left: 3px solid #569cd6; 
            color: #dcdcaa; 
            padding: 8px; 
            margin-top: 2px; 
            font-size: 11px; 
            border-radius: 0 4px 4px 0; 
            line-height: 1.3; 
            white-space: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ Remote Admin PRO</h2>
        
        <button class="btn-main" onclick="saveData()">💾 СОХРАНИТЬ ВСЁ В GITHUB</button>
        <div id="status" class="status"></div>
        
        <div class="tabs">
            <button class="tab-btn active" id="btn-waves" onclick="switchTab('waves')">🌊 Волны</button>
            <button class="tab-btn" id="btn-player" onclick="switchTab('player')">🏃 Игрок</button>
            <button class="tab-btn" id="btn-weapons" onclick="switchTab('weapons')">🔫 Оружие</button>
            <button class="tab-btn" id="btn-upgrades" onclick="switchTab('upgrades')">🃏 Карты</button>
            <button class="tab-btn" id="btn-evos" onclick="switchTab('evos')" style="color:#c586c0;">🧬 EVO</button>
            <button class="tab-btn" id="btn-bosses" onclick="switchTab('bosses')" style="color:#f48771;">👹 Боссы</button>
            <button class="tab-btn" id="btn-backups" onclick="switchTab('backups')" style="color:#ce9178;">🛡️ Бэкапы</button>
        </div>

        <div id="tab-waves" class="tab-content active">
            <button class="btn-undo" id="btn-undo" onclick="undo()">↩️ ОТМЕНИТЬ СЛУЧАЙНОЕ УДАЛЕНИЕ</button>
            <div id="waves-list"></div>
            <button class="btn-add" onclick="addFolder()" style="background:#0e639c; margin-top:20px; font-size:16px;">📁 Добавить Новую Папку</button>
        </div>
        <div id="tab-player" class="tab-content"></div>
        <div id="tab-weapons" class="tab-content"></div>
        <div id="tab-upgrades" class="tab-content"></div>
        <div id="tab-evos" class="tab-content"></div>
        <div id="tab-bosses" class="tab-content"></div>
        
        <div id="tab-backups" class="tab-content">
            <div class="panel">
                <h3 style="color:#569cd6; margin-bottom:10px; text-align:center;">📦 Сохранение и Восстановление</h3>
                <p style="color:#888; font-size:13px; text-align:center; margin-bottom:20px;">Скачайте файл с балансом на устройство. Если что-то сломается, вы сможете загрузить его обратно.</p>
                <button class="backup-btn" onclick="exportBackup()">📥 СКАЧАТЬ БЭКАП (.json)</button>
                <hr style="border: 0; border-top: 1px solid #3e3e42; margin-bottom: 20px;">
                <h4 style="color:#ce9178; text-align:center; margin-bottom:5px;">Восстановить из файла:</h4>
                <div class="file-input-wrapper">
                    <input type="file" id="importFile" accept=".json" style="background:transparent; border:none; color:#4ec9b0;" onchange="importBackup(event)">
                </div>
            </div>
        </div>
    </div>

    <script>
        const GIST_ID = '4b5faafac858635664755b821b757d35';
        const FILE_NAME = 'config.json';
        const ENEMY_IDS = ["Enemy_Standard", "Enemy_Runner", "Enemy_armor", "Enemy_Tank_Explotion", "Enemy_Tank_Toxic", "Enemy_Drone", "Helth", "Weapon"];
        const ATTACK_TYPES = ["Rift", "Laser", "EarthThrow", "Rockets", "SummonHorde"];

        let currentData = null;
        // Чтение обёрнуто не для красоты: браузер бросает SecurityError, если хранилище
        // запрещено (приватный режим, строгие настройки, data:-URL). Раньше исключение
        // летело на верхнем уровне скрипта и обрывало ВСЮ дальнейшую инициализацию —
        // выживали только объявления функций, а слушатели и константы молча пропадали.
        let token = null;
        try { token = localStorage.getItem('gh_token'); } catch (e) { console.warn('Хранилище недоступно, токен придётся вводить каждый раз'); }
        let undoStack = []; 

        // ─── Последняя правленая карточка поднимается наверх ───────────────
        // На телефоне список карточек длинный: пока доскроллишь до нужной, переключил
        // вкладку — и ищи заново. Запоминаем, в какой карточке последний раз что-то
        // меняли, и при возврате на вкладку ставим её первой.
        // Ключ — текст заголовка карточки: он уникален внутри вкладки и, в отличие от
        // индекса, не ломается как раз от перестановки, ради которой всё и затевалось.
        // Список нарочно возвращается функцией, а не лежит в const на верхнем уровне:
        // объявления функций поднимаются и работают, даже если что-то выше по скрипту упало.
        function promoteTabs() { return ['player', 'weapons', 'upgrades', 'evos']; }

        function currentTabName() {
            let el = document.querySelector('.tab-content.active');
            return el ? el.id.replace(/^tab-/, '') : null;
        }

        function cardKeyOf(card) {
            let t = card.querySelector('.card-title');
            return t ? t.textContent.trim() : null;
        }

        function rememberEditedCard(target) {
            if (!target || !target.closest) return;
            let card = target.closest('.upgrade-card');
            if (!card) return;
            let tab = currentTabName();
            if (!tab || promoteTabs().indexOf(tab) < 0) return;
            let key = cardKeyOf(card);
            if (!key) return;
            try { localStorage.setItem('lastCard_' + tab, key); } catch (e) {}
        }
        document.addEventListener('input', e => { rememberEditedCard(e.target); try { updateRevertButton(e.target); } catch (err) {} }, true);
        document.addEventListener('change', e => { rememberEditedCard(e.target); try { updateRevertButton(e.target); } catch (err) {} }, true);

        // ─── Кнопка «вернуть прежнее значение» ────────────────────────────
        // Держим снимок значений на момент последней загрузки или сохранения в гист.
        // Пока поле отличается от снимка, в его правом краю висит кнопка с прежним
        // числом: правку видно, и её всегда можно откатить. После записи в гист снимок
        // берётся заново, и кнопки исчезают — теперь это и есть сохранённое состояние.
        //
        // Только вкладки с фиксированной структурой (те же, что и у подъёма карточек):
        // в Волнах и Боссах элементы добавляются и удаляются, id полей съезжают, и кнопка
        // показывала бы значение от соседнего поля — то есть врала бы.
        function baselineStore() {
            if (!window.__baselineValues) window.__baselineValues = {};
            return window.__baselineValues;
        }
        // Боссы тоже откатываются, хотя карточки наверх там не всплывают.
        function revertScopes() { return promoteTabs().map(function(t){ return 'tab-' + t; }).concat(['tab-bosses']); }

        // Отпечаток структуры боссов: сколько боссов, блоков и атак в каждом. Поля там
        // пронумерованы по порядку, поэтому после удаления или добавления номера съезжают
        // и прежнее значение прилипло бы к соседнему полю — кнопка соврала бы. При любом
        // изменении структуры снимок по боссам сбрасывается: лучше пропасть, чем соврать.
        function bossShape() {
            return (currentData && currentData.bosses ? currentData.bosses : [])
                .map(function(b) {
                    return (b.phases || []).map(function(ph) { return (ph.attackSequence || []).length; }).join('.');
                }).join('|');
        }

        function dropBossBaselineIfReshaped() {
            let store = baselineStore();
            let now = bossShape();
            if (window.__baselineBossShape === undefined) { window.__baselineBossShape = now; return; }
            if (window.__baselineBossShape === now) return;
            Object.keys(store).forEach(function(k) {
                if (k.indexOf('b_') === 0 || k.indexOf('p_') === 0 || k.indexOf('a_') === 0) delete store[k];
            });
            window.__baselineBossShape = now;
        }

        function eachRevertInput(fn) {
            revertScopes().forEach(function(scopeId) {
                let scope = document.getElementById(scopeId);
                if (!scope) return;
                scope.querySelectorAll('input').forEach(function(inp) {
                    if (inp.id && inp.type !== 'hidden') fn(inp);
                });
            });
        }

        function snapshotBaseline() {
            let store = baselineStore();
            Object.keys(store).forEach(function(k){ delete store[k]; });
            eachRevertInput(function(inp){ store[inp.id] = (inp.type === 'checkbox') ? String(inp.checked) : inp.value; });
            window.__baselineBossShape = bossShape();
            refreshRevertButtons();
        }

        function updateRevertButton(inp) {
            if (!inp || !inp.id || inp.type === 'hidden') return;
            let store = baselineStore();
            if (!(inp.id in store)) return;          // поле появилось после снимка — сравнивать не с чем
            let host = inp.parentElement;
            if (!host) return;

            let isCheck = (inp.type === 'checkbox');
            let old = store[inp.id];
            let cur = isCheck ? String(inp.checked) : inp.value;
            let btn = host.querySelector('.revert-btn[data-for="' + inp.id + '"]');

            if (String(cur) === String(old)) {
                if (btn) { btn.remove(); if (!isCheck) inp.style.paddingRight = ''; }
                return;
            }

            host.style.position = 'relative';        // до замеров: от этого зависит offsetTop
            if (!btn) {
                btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'revert-btn';
                btn.setAttribute('data-for', inp.id);
                btn.addEventListener('click', function() {
                    let was = baselineStore()[inp.id];
                    if (isCheck) inp.checked = (was === 'true');
                    else inp.value = was;
                    inp.dispatchEvent(new Event('input', { bubbles: true }));
                    inp.dispatchEvent(new Event('change', { bubbles: true }));
                });
                host.appendChild(btn);
            }

            let label = isCheck ? (old === 'true' ? 'вкл' : 'выкл') : old;
            btn.textContent = '↺ ' + label;
            btn.title = 'Вернуть прежнее значение: ' + label;
            btn.style.top = inp.offsetTop + 'px';
            btn.style.height = inp.offsetHeight + 'px';
            // У галки поле узкое и отступом её не подвинешь — кнопку ставим следом за ней
            if (isCheck) { btn.style.right = 'auto'; btn.style.left = (inp.offsetLeft + inp.offsetWidth + 8) + 'px'; }
            else inp.style.paddingRight = (btn.offsetWidth + 10) + 'px';
        }

        function refreshRevertButtons() {
            try { dropBossBaselineIfReshaped(); } catch (e) {}
            eachRevertInput(updateRevertButton);
        }

        function promoteLastCard() {
            let tab = currentTabName();
            if (!tab || promoteTabs().indexOf(tab) < 0) return;
            let key = null;
            try { key = localStorage.getItem('lastCard_' + tab); } catch (e) {}
            if (!key) return;

            let cards = document.querySelectorAll('#tab-' + tab + ' .upgrade-card');
            for (let i = 0; i < cards.length; i++) {
                let card = cards[i];
                if (cardKeyOf(card) !== key) continue;

                let parent = card.parentElement;
                if (parent && parent.firstElementChild !== card) parent.insertBefore(card, parent.firstElementChild);

                // Подпись, чтобы перестановка не выглядела глюком
                let header = card.querySelector('.card-header');
                if (header && !header.querySelector('.last-edited-mark')) {
                    let mark = document.createElement('span');
                    mark.className = 'last-edited-mark';
                    mark.textContent = 'правили последней';
                    mark.title = 'Карточка поднята наверх, потому что её меняли последней';
                    header.appendChild(mark);
                }

                card.scrollIntoView({ block: 'nearest' });
                break;
            }
        }

        function switchTab(t) {
            try { syncData(); } catch(e) { console.error("Sync error:", e); }
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            let btn = document.getElementById('btn-' + t);
            let tab = document.getElementById('tab-' + t);
            if(btn) btn.classList.add('active');
            if(tab) tab.classList.add('active');
            try { render(); } catch(e) { console.error("Render error:", e); }
            try { updatePreviews(); } catch(e) { console.error("Preview error:", e); }
            try { promoteLastCard(); } catch(e) { console.error("Promote error:", e); }
            try { refreshRevertButtons(); } catch(e) { console.error("Revert error:", e); }
        }

        function clean(val) { let parsed = parseFloat(String(val).replace(',', '.')); return isNaN(parsed) ? 0 : parsed; }

        // ФИКС (XSS): все текстовые поля ниже (bossID, phaseName, weaponName, enemyID,
        // имя папки, тип апгрейда) приходят из гиста и вставляются в innerHTML как есть.
        // Если в гисте окажется строка вида "><img src=x onerror=...>, она бы выполнилась
        // как настоящий HTML/JS прямо в этой странице — а тут же в localStorage лежит
        // GitHub-токен. Экранируем перед вставкой.
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = Math.floor(seconds % 60);
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        function updatePhaseTime(inputEl) {
            let panel = inputEl.closest('.phase-panel');
            if (!panel) return;
            let start = parseFloat(panel.querySelector('.p-start').value) || 0;
            let end = parseFloat(panel.querySelector('.p-end').value) || 0;
            panel.querySelector('.phase-time').innerText = formatTime(start) + " - " + formatTime(end);
        }

        function saveStateForUndo() {
            try { syncData(); } catch(e){}
            undoStack.push(JSON.stringify(currentData.phases));
            document.getElementById('btn-undo').style.display = 'block';
        }

        function undo() {
            if (undoStack.length === 0) return;
            let restoredPhases = undoStack.pop();
            currentData.phases = JSON.parse(restoredPhases);
            render();
            if (undoStack.length === 0) document.getElementById('btn-undo').style.display = 'none';
            let status = document.getElementById('status');
            status.innerText = "✅ Удаление успешно отменено!";
            status.style.color = "#c586c0";
            setTimeout(() => status.innerText = "", 2000);
        }

        function removeFolder(btn, event) { event.stopPropagation(); saveStateForUndo(); btn.closest('.folder-container').remove(); syncData(); }
        function removePhase(btn) { saveStateForUndo(); btn.closest('.phase-panel').remove(); syncData(); }

        // 🔥 ФУНКЦИИ СВОРАЧИВАНИЯ БОССОВ 🔥
        // storeOpen = true: в хранилище лежит список РАСКРЫТЫХ, а не свёрнутых.
        // Нужно атакам босса — у них по умолчанию всё спрятано, иначе вкладка
        // разворачивается в простыню из десятков полей сразу при открытии.
        function togglePanelDisplay(headerEl, storageKey, storeOpen) {
            let content = headerEl.nextElementSibling;
            if (!content) return;
            let icon = headerEl.querySelector('.fold-icon');
            let id = headerEl.dataset.foldid;
            let list = [];
            try { list = JSON.parse(localStorage.getItem(storageKey) || '[]'); } catch (e) {}

            let opening = (content.style.display === 'none');
            content.style.display = opening ? 'block' : 'none';
            if (icon) icon.innerText = opening ? '▼' : '▶';

            let shouldBeInList = storeOpen ? opening : !opening;
            list = list.filter(n => n !== id);
            if (shouldBeInList) list.push(id);

            try { localStorage.setItem(storageKey, JSON.stringify(list)); } catch (e) {}
        }

        function toggleFolder(header) {
            let content = header.nextElementSibling;
            let btnAdd = content.nextElementSibling;
            let icon = header.querySelector('.fold-icon');
            let fName = header.querySelector('.f-name').value;
            let collapsed = JSON.parse(localStorage.getItem('collapsedFolders') || '[]');
            if (content.style.display === 'none') {
                content.style.display = 'block'; if(btnAdd) btnAdd.style.display = 'block'; icon.innerText = '▼';
                collapsed = collapsed.filter(n => n !== fName); 
            } else {
                content.style.display = 'none'; if(btnAdd) btnAdd.style.display = 'none'; icon.innerText = '▶';
                if (!collapsed.includes(fName)) collapsed.push(fName); 
            }
            localStorage.setItem('collapsedFolders', JSON.stringify(collapsed));
        }

        function toggleFolderEnabled(checkbox, event) {
            event.stopPropagation();
            let container = checkbox.closest('.folder-container');
            if (checkbox.checked) container.classList.remove('disabled-folder');
            else container.classList.add('disabled-folder');
        }

        function getIconForType(type) {
            const icons = { 'Speed': '⚡', 'Damage': '⚔️', 'Health': '❤️', 'Distance': '🔭', 'BushSpeed': '🍃', 'FireRate': '🔥', 'CrystalRadius': '💎', 'XpBoost': '📈', 'StunDuration': '💫', 'Piercing': '🏹', 'Ricochet': '🪃', 'Regeneration': '🩸', 'Shield': '🛡️', 'UltimateUpgrade': '💥' };
            return icons[type] || '🃏';
        }

        function ensureEvoData() {
            if (!currentData.evos) {
                // Эволюции больше не задают статы состояний — те целиком за карточками.
                // Absolute Control числовых параметров не имеет вовсе: только заморозка.
                currentData.evos = {
                    hurricaneStrafe: { miniGunDamage: 100, miniGunFireRate: 0.05, miniGunSpread: 2, miniGunMaxDistance: 50, miniGunBulletsPerShot: 1, miniGunIsSequential: false, miniGunBurstDelay: 0.05 },
                    leadDrill: { infinitePiercingValue: 100 },
                    homing: { evoRicochetCount: 15, evoRicochetRadius: 40, evoBonusHeadChance: 50 },
                    tank: { explosionDamage: 75, explosionRadius: 3.5, explosionShakeMagnitude: 0, explosionShakeDuration: 0 , soloDelay: 0, comboDelay: 0.15, chainStepDelay: 0.05}
                };
            }
        }

        function syncData() {
            if(!currentData) return;
            if(!currentData.bosses) currentData.bosses = [];
            
            try {
                if(document.getElementById('bosses-container')) {
                    let newBosses = [];
                    document.querySelectorAll('.boss-panel').forEach(bEl => {
                        let boss = {
                            bossID: bEl.querySelector('.b-id').value,
                            spawnTime: clean(bEl.querySelector('.b-time').value),
                            phases: []
                        };
                        
                        bEl.querySelectorAll('.phase-panel').forEach(pEl => {
                            let phase = {
                                phaseName: pEl.querySelector('.p-name').value,
                                startAtHpPercent: clean(pEl.querySelector('.p-start-hp').value),
                                endAtHpPercent: clean(pEl.querySelector('.p-end-hp').value),
                                timeBetweenAttacks: clean(pEl.querySelector('.p-delay').value),
                                attackSequence: []
                            };
                            
                            pEl.querySelectorAll('.attack-panel').forEach(aEl => {
                                let aType = aEl.querySelector('.a-type').value;
                                let attack = { attackType: aType };
                                aEl.querySelectorAll('.a-param').forEach(paramEl => {
                                    if(paramEl.type === 'checkbox') attack[paramEl.dataset.key] = paramEl.checked;
                                    else attack[paramEl.dataset.key] = clean(paramEl.value);
                                });
                                phase.attackSequence.push(attack);
                            });
                            boss.phases.push(phase);
                        });
                        newBosses.push(boss);
                    });
                    currentData.bosses = newBosses;
                }
            } catch(e) { console.error("Ошибка синхронизации Боссов:", e); }

            try {
                if(document.querySelector('#waves-list .folder-container')) {
                    let newPhases = [];
                    document.querySelectorAll('.folder-container').forEach(folderEl => {
                        let folderName = folderEl.querySelector('.f-name').value;
                        let folderEnabled = folderEl.querySelector('.f-enabled').checked;
                        folderEl.querySelectorAll('.phase-panel').forEach(panel => {
                            let phase = { phaseName: panel.querySelector('.p-name').value, startTime: clean(panel.querySelector('.p-start').value), endTime: clean(panel.querySelector('.p-end').value), spawnInterval: clean(panel.querySelector('.p-int').value), enemiesPerBatch: parseInt(panel.querySelector('.p-batch').value) || 1, enemies: [], folder: folderName, isEnabled: folderEnabled };
                            panel.querySelectorAll('.enemy-row').forEach(row => { phase.enemies.push({ enemyID: row.querySelector('.e-id').value, weight: clean(row.querySelector('.e-w').value) }); });
                            newPhases.push(phase);
                        });
                    });
                    currentData.phases = newPhases;
                }
            } catch(e) {}
            
            try {
                if(document.getElementById('ps_fSpeed')) {
                    if (!currentData.playerStats) currentData.playerStats = {};
                    let getVal = function(id, fallback) { let el = document.getElementById(id); return el ? clean(el.value) : fallback; };
                    currentData.playerStats.forwardSpeed = getVal('ps_fSpeed', currentData.playerStats.forwardSpeed);
                    currentData.playerStats.strafeSpeed = getVal('ps_sSpeed', currentData.playerStats.strafeSpeed);
                    currentData.playerStats.bodyTurnSpeed = getVal('ps_bTurn', currentData.playerStats.bodyTurnSpeed || 10);
                    currentData.playerStats.maxBodyTurnAngle = getVal('ps_mAng', currentData.playerStats.maxBodyTurnAngle || 45);
                    currentData.playerStats.maxHealth = parseInt(getVal('ps_mHealth', currentData.playerStats.maxHealth));
                    currentData.playerStats.maxShields = parseInt(getVal('ps_mShields', currentData.playerStats.maxShields));
                    currentData.playerStats.shieldRegenTime = getVal('ps_sRegen', currentData.playerStats.shieldRegenTime);
                    currentData.playerStats.ricochetRadius = getVal('ps_rRadius', currentData.playerStats.ricochetRadius);
                    currentData.playerStats.radiusBonusPerUpgrade = getVal('ps_rBonus', currentData.playerStats.radiusBonusPerUpgrade);
                    currentData.playerStats.ricochetHeadChance = getVal('ps_rHead', currentData.playerStats.ricochetHeadChance);
                    currentData.playerStats.ricochetLegChance = getVal('ps_rLeg', currentData.playerStats.ricochetLegChance);
                    // Крит переехал с карточки Дальности на карточку Рикошета: столько процентов даёт каждый её уровень
                    currentData.playerStats.critPerRicochetLevel = getVal('ps_critPerRico', 6);
                    currentData.playerStats.baseXP = getVal('ps_bXP', currentData.playerStats.baseXP || 5);
                    currentData.playerStats.growthFactor = getVal('ps_gFactor', currentData.playerStats.growthFactor || 10);
                    // Галки отладочной выдачи. Отдельный раздел: к статам игрока отношения не имеет.
                    let swEl = document.getElementById('dbg_weapon');
                    if (swEl) currentData.startWeapon = swEl.value;
                    if (!currentData.startEvos) currentData.startEvos = {};
                    [['se_hs','hurricaneStrafe'],['se_ac','absoluteControl'],['se_ld','leadDrill'],
                     ['se_hm','homing'],['se_tk','tank']].forEach(function(r) {
                        let el = document.getElementById(r[0]);
                        if (el) currentData.startEvos[r[1]] = el.checked;
                    });
                }
            } catch(e) {}

            try {
                if(document.getElementById('mg_dmg')) {
                    ensureEvoData();
                    let g = id => clean(document.getElementById(id).value);
                    currentData.evos.hurricaneStrafe.miniGunDamage = g('mg_dmg');
                    currentData.evos.hurricaneStrafe.miniGunFireRate = g('mg_fr');
                    currentData.evos.hurricaneStrafe.miniGunMaxDistance = g('mg_dist');
                    currentData.evos.hurricaneStrafe.miniGunSpread = g('mg_spr');
                    currentData.evos.hurricaneStrafe.miniGunBulletsPerShot = g('mg_bps');
                    currentData.evos.hurricaneStrafe.miniGunBurstDelay = g('mg_bd');
                    currentData.evos.hurricaneStrafe.miniGunIsSequential = document.getElementById('mg_seq').checked;
                }
            } catch(e) {}

            try {
                if(document.querySelector('.w-dmg') && currentData.weapons) {
                    currentData.weapons.forEach((w, i) => {
                        let dmgEl = document.getElementById('w_dmg_' + i);
                        if(dmgEl) { w.damage = clean(dmgEl.value); w.fireRate = clean(document.getElementById('w_fr_' + i).value); w.maxDistance = clean(document.getElementById('w_dist_' + i).value); w.spread = clean(document.getElementById('w_spr_' + i).value); }
                    });
                }
            } catch(e) {}

            try {
                if(document.getElementById('u_en_0') && currentData.upgrades) {
                    currentData.upgrades.forEach((u, i) => {
                        let enEl = document.getElementById('u_en_' + i);
                        if(enEl) { u.isEnabled = enEl.checked; let levelsArr = []; for(let lv=0; lv<5; lv++) { let lvEl = document.getElementById('u_lv_' + i + '_' + lv); levelsArr.push(lvEl ? clean(lvEl.value) : 0); } u.levelValues = levelsArr; }
                    });
                }
            } catch(e) {}

            try {
                // Сторож: собираем эволюции только если вкладка отрисована.
                // Раньше проверялось поле evo_ac_regen — его удалили вместе с реген-параметром
                // Абсолютного контроля, и блок молча переставал сохраняться.
                if(document.getElementById('evo_ld_pierce')) {
                    ensureEvoData();
                    let getVal = function(id, fallback) { let el = document.getElementById(id); return el ? clean(el.value) : fallback; };
                    currentData.evos.leadDrill.infinitePiercingValue = parseInt(getVal('evo_ld_pierce', 100));
                    currentData.evos.homing.evoRicochetCount = parseInt(getVal('evo_hm_rico', 15));
                    currentData.evos.homing.evoRicochetRadius = getVal('evo_hm_rad', 40);
                    currentData.evos.homing.evoBonusHeadChance = getVal('evo_hm_crit', 50);
                    currentData.evos.tank.explosionDamage = parseInt(getVal('evo_tk_dmg', 75));
                    currentData.evos.tank.explosionRadius = getVal('evo_tk_rad', 3.5);
                    currentData.evos.tank.explosionShakeMagnitude = getVal('evo_tk_shake_mag', 0);
                    currentData.evos.tank.explosionShakeDuration = getVal('evo_tk_shake_dur', 0);
                    currentData.evos.tank.soloDelay = getVal('evo_tk_solo', 0);
                    currentData.evos.tank.comboDelay = getVal('evo_tk_combo', 0.15);
                    currentData.evos.tank.chainStepDelay = getVal('evo_tk_step', 0.05);
                }
            } catch(e) {}
        }

        function render() {
            if(!currentData) return;
            ensureEvoData();
            if (!currentData.bosses) currentData.bosses = [];

            if (document.getElementById('tab-bosses').classList.contains('active')) {
                let bh = '<div id="bosses-container">';
                let colB = JSON.parse(localStorage.getItem('colBoss') || '[]');
                // У атак храним РАСКРЫТЫЕ, а не свёрнутые: по умолчанию параметры спрятаны,
                // иначе вкладка превращается в простыню из десятков полей.
                let expA = JSON.parse(localStorage.getItem('expAttack') || '[]');

                if (currentData.bosses) {
                    currentData.bosses.forEach((boss, bIdx) => {
                        let bIdStr = "boss_" + bIdx;
                        let bIsCollapsed = colB.includes(bIdStr);
                        let bDisp = bIsCollapsed ? 'none' : 'block';
                        let bIcon = bIsCollapsed ? '▶' : '▼';

                        let phases = boss.phases || [];
                        let attackTotal = phases.reduce((n, ph) => n + ((ph.attackSequence || []).length), 0);
                        let emptyBlocks = phases.filter(ph => !ph.attackSequence || ph.attackSequence.length === 0).length;

                        let problems = [];
                        if ((boss.bossID || '').trim() === '') problems.push('Пустой ID — не найдётся префаб босса');
                        if (attackTotal === 0) problems.push('Ни одной атаки — босс появится и будет просто стоять');
                        else if (emptyBlocks > 0) problems.push('Блоков без атаки: ' + emptyBlocks);

                        bh += `<div class="panel boss-panel boss-card" style="padding-bottom:5px;">
                            <div class="header-row" data-foldid="${bIdStr}" style="cursor:pointer; border-bottom:none; margin-bottom:0; gap:8px;" onclick="togglePanelDisplay(this, 'colBoss')">
                                <span class="fold-icon" style="color:#f48771; font-size:14px;">${bIcon}</span>
                                <span style="font-size:20px;">👹</span>
                                <input type="text" class="b-id" value="${escapeHtml(boss.bossID)}" onclick="event.stopPropagation()" placeholder="ID префаба" style="flex:1; min-width:80px; font-weight:bold; color:#f48771; margin:0;">
                                <span style="font-size:11px; color:#888; white-space:nowrap;">#${bIdx + 1} · ${attackTotal} атак</span>
                                <button class="btn-remove" onclick="event.stopPropagation(); this.closest('.boss-panel').remove(); syncData(); render();">✖</button>
                            </div>
                            <div class="boss-content" style="display:${bDisp}; margin-top:12px; border-top:1px solid #3e3e42; padding-top:12px;">
                                <div class="row" style="margin-bottom:12px;"><div style="flex:1"><label style="margin-bottom:3px;">Появляется на секунде</label><input type="number" id="b_${bIdx}_time" class="b-time" value="${boss.spawnTime}" style="margin:0;"></div></div>
                                ${problems.length ? `<div style="margin-bottom:12px; padding:8px; border-radius:4px; background:#2a1a1a; border-left:3px solid #f48771; color:#f48771; font-size:11px; line-height:1.5; white-space:normal;">⚠️ ${problems.join('<br>⚠️ ')}</div>` : ''}
                                <div class="phases-list">`;

                        phases.forEach((phase, pIdx) => {
                            let aIdStr = "att_" + bIdx + "_" + pIdx;
                            let isOpen = expA.includes(aIdStr);
                            let aDisp = isOpen ? 'block' : 'none';
                            let aIcon = isOpen ? '▼' : '▶';

                            let seq = phase.attackSequence || [];
                            let title = seq.length === 0 ? '— атака не выбрана —'
                                      : (seq.length === 1 ? seq[0].attackType : seq.length + ' атаки подряд');
                            let hpFrom = phase.startAtHpPercent !== undefined ? phase.startAtHpPercent : 100;
                            let hpTo = phase.endAtHpPercent !== undefined ? phase.endAtHpPercent : 0;

                            bh += `<div class="phase-card phase-panel" style="padding-bottom:5px;">
                                <div class="header-row" data-foldid="${aIdStr}" style="cursor:pointer; border-bottom:none; margin-bottom:0; gap:8px;" onclick="togglePanelDisplay(this, 'expAttack', true)">
                                    <span class="fold-icon" style="color:#c586c0; font-size:12px;">${aIcon}</span>
                                    <span style="flex:1; color:#c586c0; font-weight:bold; font-size:13px; white-space:normal;">${escapeHtml(title)}</span>
                                    <span style="font-size:11px; color:#888; white-space:nowrap;">${hpFrom}→${hpTo}%</span>
                                    <button class="btn-remove" onclick="event.stopPropagation(); this.closest('.phase-panel').remove(); syncData(); render();">✖</button>
                                </div>
                                <div class="phase-content" style="display:${aDisp}; margin-top:10px; border-top:1px dashed #555; padding-top:10px;">
                                    <input type="hidden" class="p-name" value="${escapeHtml(phase.phaseName || ('Блок ' + (pIdx + 1)))}">
                                    <div class="row" style="margin-bottom:10px;">
                                        <div style="flex:1"><label style="margin-bottom:3px;">Включается на HP %</label><input type="number" id="p_${bIdx}_${pIdx}_start" class="p-start-hp" value="${hpFrom}" style="margin:0; border-color:#2ea043;"></div>
                                        <div style="flex:1"><label style="margin-bottom:3px;">Работает до HP %</label><input type="number" id="p_${bIdx}_${pIdx}_end" class="p-end-hp" value="${hpTo}" style="margin:0; border-color:#8a2a2a;"></div>
                                        <div style="flex:1"><label style="margin-bottom:3px;">Пауза, сек</label><input type="number" step="0.1" id="p_${bIdx}_${pIdx}_delay" class="p-delay" value="${phase.timeBetweenAttacks}" style="margin:0;"></div>
                                    </div>
                                    <div class="attacks-list">`;

                            seq.forEach((attack, aIdx) => { bh += generateAttackHtml(attack, `a_${bIdx}_${pIdx}_${aIdx}`); });

                            bh += `</div>
                                    <button class="btn-add" onclick="addAttack(this)" style="background:#0e639c; padding:6px; font-size:12px; margin-top:8px;">+ Ещё атака в этот же блок</button>
                                </div>
                            </div>`;
                        });

                        bh += `</div>
                                <button class="btn-add" onclick="addBossAttack(this)" style="background:#569cd6; margin-top:10px;">➕ Добавить атаку боссу</button>
                            </div></div>`;
                    });
                }
                bh += `</div><button class="btn-main" onclick="addBoss()">➕ ДОБАВИТЬ БОССА</button>
                    <div style="color:#888; font-size:11px; line-height:1.5; padding:10px 2px; white-space:normal;">Босс — это папка: ID выбирает <b>префаб</b>, а порядок в списке — <b>какая это по счёту встреча</b>. Один ID можно ставить нескольким боссам: получатся разные бои на одной модели. Внутри — атаки, каждая включается на своём пороге здоровья и работает, пока HP не упадёт до нижней границы.</div>`;
                document.getElementById('tab-bosses').innerHTML = bh;
            }
            
            let h = '';
            let folders = {};
            
            if (currentData.phases && currentData.phases.length > 0) {
                currentData.phases.forEach((p) => {
                    let fName = p.folder || "Основная папка";
                    if (!folders[fName]) folders[fName] = { isEnabled: p.isEnabled !== false, phases: [] };
                    folders[fName].phases.push(p);
                });
            } else {
                folders["Основная папка"] = { isEnabled: true, phases: [] }; 
            }

            let collapsed = JSON.parse(localStorage.getItem('collapsedFolders') || '[]');

            for (let fName in folders) {
                let fData = folders[fName];
                let disabledClass = fData.isEnabled ? '' : 'disabled-folder';
                
                let isCollapsed = collapsed.includes(fName);
                let displayStyle = isCollapsed ? 'none' : 'block';
                let iconText = isCollapsed ? '▶' : '▼';
                
                h += `<div class="folder-container panel ${disabledClass}" style="background:#252526; border-left: 4px solid #c586c0; padding:10px;">
                    <div class="header-row" style="cursor:pointer; border-bottom:none; margin-bottom:0; padding-bottom:0;" onclick="toggleFolder(this)">
                        <div class="drag-handle folder-drag" style="color:#c586c0;">☰</div>
                        <span class="fold-icon" style="color:#c586c0; margin-right:10px; font-size:12px;">${iconText}</span>
                        <input type="text" class="f-name" value="${escapeHtml(fName)}" onclick="event.stopPropagation()" style="margin:0; font-weight:bold; flex:1; border-color:#c586c0; color:#c586c0; background:transparent;">
                        <label style="margin: 0 15px; display:flex; align-items:center; cursor:pointer;" onclick="event.stopPropagation()">
                            <input type="checkbox" class="f-enabled" ${fData.isEnabled ? 'checked' : ''} onchange="toggleFolderEnabled(this, event)" style="width:16px;height:16px;margin:0 5px 0 0;"> ВКЛ
                        </label>
                        <button class="btn-remove" onclick="removeFolder(this, event)">✖</button>
                    </div>
                    <div class="folder-content sortable-list" style="display:${displayStyle}; margin-top:15px; min-height:10px; padding-left:15px; border-left:2px solid #3e3e42;">`;

                fData.phases.forEach(p => {
                    h += generatePhaseHtml(p);
                });
                
                h += `</div><button class="btn-add folder-add-btn" onclick="addPhaseToFolder(this)" style="display:${displayStyle}; background:#1f6b35;">➕ Добавить Волну в папку</button></div>`;
            }
            document.getElementById('waves-list').innerHTML = h;
            
            document.querySelectorAll('.p-start').forEach(el => updatePhaseTime(el));
            initSortable();

            let ph = '<div class="cards-grid">';

                    ${makeParam('Fly Speed', 'stonesSpeed', attack.stonesSpeed ?? 25.0, 'Скорость полета камня к цели.')}
                    ${makeParam('Damage', 'stonesDamage', attack.stonesDamage ?? 2, 'Урон при прямом попадании камня.', 'number', '')}
                </div>`;
            } 
            else if (attack.attackType === 'Rockets') {
                paramsHtml = `<div class="row" style="flex-wrap: wrap;">
                    ${makeParam('Launch Count', 'rocketsLaunchCount', attack.rocketsLaunchCount ?? 5, 'Сколько ракет вылетает за один залп.', 'number', '')}

                    ${makeParam('Launch Delay', 'rocketsLaunchDelay', attack.rocketsLaunchDelay ?? 0.2, 'Задержка между вылетами ракет (эффект пулемета).')}
                    ${makeParam('Scatter', 'rocketsLaunchScatter', attack.rocketsLaunchScatter ?? 20.0, 'Ширина разброса при запуске вверх (угол).')}
                    ${makeParam('Warn Count', 'rocketsWarningCount', attack.rocketsWarningCount ?? 5, 'Сколько красных кругов бомбардировки появится на земле.', 'number', '')}
                    ${makeParam('Warn Dur.', 'rocketsWarningDuration', attack.rocketsWarningDuration ?? 2.5, 'Как долго круг мигает до падения ракеты.')}
                    ${makeParam('Expl. Radius', 'rocketsExplosionRadius', attack.rocketsExplosionRadius ?? 6.0, 'Радиус урона (и размера круга) при взрыве.')}
                    ${makeParam('Fall Speed', 'rocketsFallSpeed', attack.rocketsFallSpeed ?? 50.0, 'С какой скоростью ракета падает с небес.')}
                    ${makeParam('Fall Delay', 'rocketsFallDelay', attack.rocketsFallDelay ?? 0.2, 'Задержка между падением ракет (ковровая бомбардировка).')}
                    ${makeParam('Damage', 'rocketsDamage', attack.rocketsDamage ?? 2, 'Урон от взрыва ракеты.', 'number', '')}
                    ${makeParam('Show Sphere', 'rocketsShowDebug', attack.rocketsShowDebug, 'Показывать полупрозрачную сферу взрыва (полезно для настройки радиуса).', 'checkbox')}
                </div>`;
            } 
            else if (attack.attackType === 'SummonHorde') {
                paramsHtml = `<div class="row" style="flex-wrap: wrap;">
                    ${makeParam('Enemy Count', 'hordeEnemyCount', attack.hordeEnemyCount ?? 4, 'Сколько врагов вылезет из-под земли.', 'number', '')}
                    ${makeParam('Lifetime', 'hordeEnemyLifetime', attack.hordeEnemyLifetime ?? 12.0, 'Через сколько секунд призванные враги умрут сами.')}
                    ${makeParam('Delay Btw', 'hordeDelayBetweenSpawns', attack.hordeDelayBetweenSpawns ?? 0.5, 'Пауза между появлением каждого следующего врага.')}
                    ${makeParam('Emerge Time', 'hordeEmergeTime', attack.hordeEmergeTime ?? 1.5, 'Скорость анимации вылезания врага из земли.')}
                    ${makeParam('Ambush Chance', 'hordeAmbushChance', attack.hordeAmbushChance ?? 0.6, 'Шанс (от 0 до 1), что враг вылезет прямо перед лицом бегущего игрока.')}

                    ${makeParam('Main Shake Dur.', 'hordeShakeDuration', attack.hordeShakeDuration ?? 0.4, 'Как долго трясет арену (основной толчок).')}

        function addBoss() {
            if (!currentData.bosses) currentData.bosses = [];
            currentData.bosses.push({ bossID: "Boss_1", spawnTime: 300, phases: [{ phaseName: "Блок 1", startAtHpPercent: 100, endAtHpPercent: 0, timeBetweenAttacks: 3, attackSequence: [{ attackType: "Laser", laserRotationSpeed: 45, laserBeamCount: 1 }] }] });
            render();
        }
        function addPhase(btn) {
            let bossPanel = btn.closest('.boss-panel');
            let bIdx = Array.from(bossPanel.parentNode.children).indexOf(bossPanel);
            let prevPhase = currentData.bosses[bIdx].phases[currentData.bosses[bIdx].phases.length - 1];
            let newStart = prevPhase ? prevPhase.endAtHpPercent : 50;
            currentData.bosses[bIdx].phases.push({ phaseName: "Новая Фаза", startAtHpPercent: newStart, endAtHpPercent: newStart / 2, timeBetweenAttacks: 2, attackSequence: [] });
            render();
        }
        // Атака боссу — это новый блок с порогом здоровья и одной атакой внутри.
        // В данных это по-прежнему «фаза», игра читает их так же; в интерфейсе фаза
        // как отдельное понятие больше не показывается — блок и есть атака.
        function addBossAttack(btn) {
            let bossPanel = btn.closest('.boss-panel');
            let bIdx = Array.from(bossPanel.parentNode.children).indexOf(bossPanel);
            let phases = currentData.bosses[bIdx].phases;
            let prev = phases[phases.length - 1];
            // Продолжаем лестницу здоровья с того места, где кончился прошлый блок
            let newStart = prev ? prev.endAtHpPercent : 100;
            phases.push({
                phaseName: "Блок " + (phases.length + 1),
                startAtHpPercent: newStart,
                endAtHpPercent: Math.max(0, Math.floor(newStart / 2)),
                timeBetweenAttacks: 3,
                attackSequence: [{ attackType: "Laser", laserRotationSpeed: 45, laserBeamCount: 1 }]
            });
            render();
        }

            let pIdx = Array.from(phasePanel.parentNode.children).indexOf(phasePanel);
            currentData.bosses[bIdx].phases[pIdx].attackSequence.push({ attackType: "Laser", laserRotationSpeed: 45, laserBeamCount: 1 });
            render();
        }
