        function updatePreviews() {
            try {
                if(!currentData || !currentData.upgrades || !document.getElementById('preview_u_0')) return;

                currentData.upgrades.forEach((u, i) => {
                    let previewDiv = document.getElementById('preview_u_' + i);
                    if (!previewDiv) return;

                    let tbInput = document.getElementById('u_testbase_' + i);
                    let hasTestBase = (tbInput && tbInput.value !== "");
                    let tBase = hasTestBase ? clean(tbInput.value) : 0;

                    let levels = [];
                    for(let lv=0; lv<5; lv++) {
                        let lvInput = document.getElementById('u_lv_' + i + '_' + lv);
                        levels.push(lvInput ? clean(lvInput.value) : 0);
                    }

                    let text = "";
                    
                    if (u.type === "Damage" || u.type === "FireRate") {
                        // Оба стата — множители к базе оружия. У скорострельности множитель
                        // в UpgradeFireRate зажат снизу: Mathf.Max(0.1f, ...), то есть темп
                        // не может стать быстрее 10% от базового, сколько ни накручивай.
                        const stepMult = (m, v) => {
                            if (u.type === "Damage") return m * (1 + v);
                            return Math.max(0.1, m * (1 - v));
                        };
                        if (hasTestBase) {
                            let mult = 1;
                            let steps = [];
                            for(let lv=0; lv<5; lv++) {
                                mult = stepMult(mult, levels[lv]);
                                steps.push((tBase * mult).toFixed(1));
                            }
                            text = "<b>🧪 ТЕСТ (База " + tBase + ")</b>:<br>" + steps.join(" ➔ ");
                        } else {
                            if (currentData.weapons) {
                                let weaponTexts = currentData.weapons.map((w, wIdx) => {
                                    let dmgInput = document.getElementById('w_dmg_' + wIdx);
                                    let frInput = document.getElementById('w_fr_' + wIdx);
                                    let baseDmg = clean(dmgInput ? dmgInput.value : w.damage);
                                    let baseFr = clean(frInput ? frInput.value : w.fireRate);
                                    
                                    let base = u.type === "Damage" ? baseDmg : baseFr;
                                    let mult = 1;
                                    let steps = [];
                                    for(let lv=0; lv<5; lv++) {
                                        mult = stepMult(mult, levels[lv]);
                                        steps.push((base * mult).toFixed(u.type === "Damage" ? 1 : 3));
                                    }
                                    return "<b>" + w.weaponName + "</b>:<br>" + steps.join(" ➔ ");
                                });
                                text = weaponTexts.join("<br><br>");

                                // Миниган живёт в evos, а не в списке оружия, но карточка Урона
                                // умножает и его — значит он должен быть в таблице.
                                if (u.type === "Damage") {
                                    let mgDmgEl = document.getElementById('mg_dmg');
                                    let mgDmg = mgDmgEl ? clean(mgDmgEl.value)
                                                        : ((currentData.evos && currentData.evos.hurricaneStrafe && currentData.evos.hurricaneStrafe.miniGunDamage) || 100);
                                    let m = 1, mgSteps = [];
                                    for (let lv = 0; lv < 5; lv++) { m = stepMult(m, levels[lv]); mgSteps.push((mgDmg * m).toFixed(1)); }
                                    text += "<br><br><b>Миниган (Ураганный стрейф)</b>:<br>" + mgSteps.join(" ➔ ");
                                }

                                if (u.type === "FireRate") {
                                    let mgFrEl = document.getElementById('mg_fr');
                                    let mgFr = mgFrEl ? clean(mgFrEl.value)
                                                      : ((currentData.evos && currentData.evos.hurricaneStrafe && currentData.evos.hurricaneStrafe.miniGunFireRate) || 0.05);
                                    text += "<br><br><b>Миниган</b>: " + mgFr + " — не меняется" +
                                            "<br><span style='color:#888'>Задержка минигана задана жёстко на вкладке Оружие и не умножается — умножать уже нечем: взяв эволюцию, игрок тратит на неё шестой уровень Скорострельности, и карточка выпадает из пула навсегда. Таблица выше описывает только жизнь до минигана.</span>";
                                }
                            }
                        }
                    }
                    else if (u.type === "Health") {
                        let hpInput = document.getElementById('ps_mHealth');
                        let baseHpValue = 3;
                        if (hpInput) {
                            baseHpValue = clean(hpInput.value);
                        } else if (currentData.playerStats && currentData.playerStats.maxHealth) {
                            baseHpValue = currentData.playerStats.maxHealth;
                        }
                        
                        // Mathf.RoundToInt в C# округляет ровную половину К ЧЁТНОМУ (2.5 -> 2),
                        // а Math.round в JS — вверх (2.5 -> 3). На процентах вроде 0.5 панель
                        // расходилась бы с игрой на целое сердце, поэтому повторяем C#.
                        const roundHalfToEven = x => {
                            const f = Math.floor(x), d = x - f;
                            if (d > 0.5) return f + 1;
                            if (d < 0.5) return f;
                            return (f % 2 === 0) ? f : f + 1;
                        };
                        let baseHp = hasTestBase ? roundHalfToEven(tBase) : roundHalfToEven(baseHpValue);
                        let currentVal = baseHp;
                        let steps = [];
                        for(let lv=0; lv<5; lv++) {
                            let bonus = roundHalfToEven(currentVal * levels[lv]);
                            if (bonus < 1) bonus = 1;
                            currentVal += bonus;
                            steps.push(currentVal);
                        }
                        text = "<b>HP Игрока" + (hasTestBase ? " (ТЕСТ)" : "") + "</b>:<br>" + steps.join(" ➔ ") + " (сердец)";
                    }
                    else if (u.type === "Speed") {
                        let spdInput = document.getElementById('ps_sSpeed');
                        let baseSpdValue = 20;
                        if (spdInput) {
                            baseSpdValue = clean(spdInput.value);
                        } else if (currentData.playerStats && currentData.playerStats.strafeSpeed) {
                            baseSpdValue = currentData.playerStats.strafeSpeed;
                        }

                        let turnInput = document.getElementById('ps_bTurn');
                        let baseTurnValue = 10;
                        if (turnInput) {
                            baseTurnValue = clean(turnInput.value);
                        } else if (currentData.playerStats && currentData.playerStats.bodyTurnSpeed) {
                            baseTurnValue = currentData.playerStats.bodyTurnSpeed;
                        }

                        let currentStrafe = baseSpdValue;
                        let currentTurn = baseTurnValue;
                        
                        let strafeSteps = [];
                        let turnSteps = [];
                        
                        for(let lv=0; lv<5; lv++) {
                            currentStrafe *= (1 + levels[lv]);
                            currentTurn *= (1 + (levels[lv] * 0.5)); 
                            
                            strafeSteps.push(currentStrafe.toFixed(1));
                            turnSteps.push(currentTurn.toFixed(1));
                        }
                        
                        text = "<b><span style='color:#72ebd1'>Скор. Стрейфа</span> (База " + baseSpdValue + ")</b>:<br>" + strafeSteps.join(" ➔ ") +
                               "<br><br><b><span style='color:#ce9178'>Скор. Прицела</span> (Бонус)</b>:<br>" + turnSteps.join(" ➔ ");
                    }
                    else if (u.type === "Shield") {
                        // Щит — единственная карточка, у которой levelValues НЕ используются:
                        // LevelUpManager подставляет сюда НОМЕР уровня карточки
                        //   effectValue = (type == Shield) ? upgradeLevels[t] : levelValues[...]
                        // поэтому UpgradeShield всегда получает 1..5 по порядку, что бы ни
                        // стояло в полях выше. Раньше здесь считалось по int(levelValues) —
                        // при значениях 1.5/1.5/1.5/1.5/2 панель показывала четыре одинаковых
                        // шага, хотя игра выдаёт всю лестницу.
                        const shieldTable = { 1: [1, 30], 2: [1, 20], 3: [2, 20], 4: [2, 15], 5: [3, 10] };
                        let steps = [];
                        for (let lv = 1; lv <= 5; lv++) {
                            let entry = shieldTable[lv];
                            steps.push(entry[0] + "щ/" + entry[1] + "с");
                        }
                        text = "<b>Щиты (макс / реген)</b>:<br>" + steps.join(" ➔ ") +
                               "<br><span style='color:#888'>Значения в полях выше на щит не влияют вообще: игра берёт номер уровня карточки. Сама лестница захардкожена в PlayerHealth.UpgradeShield.</span>";
                    }
                    else if (u.type === "Distance") {
                        // Крит отсюда УЕХАЛ на карточку Рикошета — расчёт смотри там.
                        // Дальность даёт только дистанцию и кучность.
                        //
                        // Игра вызывает UpgradeDistance((int)levelValues[уровень-1]), а там switch
                        // по 1..5, который ПРИСВАИВАЕТ множители, а не копит их. То есть поля выше —
                        // это номера ступеней, а не проценты: поставил 1,1,1,1,1 — и все пять
                        // уровней дадут одну и ту же ступень. Число вне 1..5 не делает ничего.
                        const distTable = { 1: [1.1, 0.8], 2: [1.2, 0.6], 3: [1.3, 0.4], 4: [1.4, 0.2], 5: [1.5, 0.0] };
                        let distMults = [], spreadMults = [], badSteps = [];
                        let curDist = 1.0, curSpr = 1.0;
                        for (let lv = 0; lv < 5; lv++) {
                            let castLevel = Math.trunc(levels[lv]);
                            let entry = distTable[castLevel];
                            if (entry) { curDist = entry[0]; curSpr = entry[1]; }
                            else badSteps.push("ур." + (lv + 1) + ": " + levels[lv] + "→" + castLevel);
                            distMults.push(curDist);
                            spreadMults.push(curSpr);
                        }

                        let textBlocks = [];
                        if (badSteps.length) textBlocks.push("<span style='color:#f48771'>⚠️ Ступени вне 1..5 не дают эффекта — " + badSteps.join(", ") + ". Значение просто остаётся прежним.</span>");

                        if (currentData.weapons) {
                            currentData.weapons.forEach((w, wIdx) => {
                                let distInput = document.getElementById('w_dist_' + wIdx);
                                let sprInput = document.getElementById('w_spr_' + wIdx);
                                let baseDist = clean(distInput ? distInput.value : w.maxDistance);
                                let baseSpr = clean(sprInput ? sprInput.value : w.spread);
                                
                                let distSteps = [];
                                let sprSteps = [];
                                for(let lv=0; lv<5; lv++) {
                                    distSteps.push((baseDist * distMults[lv]).toFixed(1));
                                    sprSteps.push((baseSpr * spreadMults[lv]).toFixed(1));
                                }
                                textBlocks.push("<b>" + w.weaponName + "</b>:<br><span style='color:#b5cea8'>Дальн:</span> " + distSteps.join(" ➔ ") + "<br><span style='color:#ce9178'>Разброс:</span> " + sprSteps.join(" ➔ "));
                            });
                        }
                        // Миниган — не WeaponConfig, в списке оружия его нет, но карточка
                        // Дальности умножает и его дистанцию. Без этой строки панель
                        // показывала бы дальности стволов, которых в руках уже не будет.
                        let mgInput = document.getElementById('mg_dist');
                        let mgDist = mgInput ? clean(mgInput.value)
                                             : ((currentData.evos && currentData.evos.hurricaneStrafe && currentData.evos.hurricaneStrafe.miniGunMaxDistance) || 50);
                        let mgSteps = [];
                        for (let lv = 0; lv < 5; lv++) mgSteps.push((mgDist * distMults[lv]).toFixed(1));
                        textBlocks.push("<b>Миниган (Ураганный стрейф)</b>:<br><span style='color:#b5cea8'>Дальн:</span> " + mgSteps.join(" ➔ ") +
                                        "<br><span style='color:#888'>Разброс у минигана свой и карточкой не меняется — он в карточке «Миниган» на вкладке Оружие.</span>");
                        text = textBlocks.join("<br><br>");
                    }
                    else if (u.type === "BushSpeed") {
                        let baseBush = 6.0; 
                        let baseStumble = 1.0; 
                        
                        let bushSteps = [];
                        let treeSteps = [];
                        let currentBush = baseBush;
                        let currentStumble = baseStumble;

                        for(let lv=0; lv<5; lv++) {
                            currentBush += levels[lv];
                            bushSteps.push(currentBush.toFixed(1));
                            
                            currentStumble -= 0.2;
                            if (currentStumble <= 0.05) currentStumble = 0;
                            treeSteps.push((currentStumble === 0) ? "0 (Игнор)" : "x" + currentStumble.toFixed(1));
                        }

                        text = "<b>Скор. в кустах (База 6.0)</b>:<br>" + bushSteps.join(" ➔ ") + 
                               "<br><br><b>Штраф от деревьев</b>:<br>" + treeSteps.join(" ➔ ");
                    }
                    else if (u.type === "XpBoost") {
                        let bXpInput = document.getElementById('ps_bXP');
                        let gFactorInput = document.getElementById('ps_gFactor');
                        let baseXP = bXpInput ? clean(bXpInput.value) : (currentData.playerStats ? currentData.playerStats.baseXP : 5);
                        let gFactor = gFactorInput ? clean(gFactorInput.value) : (currentData.playerStats ? currentData.playerStats.growthFactor : 10);

                        let multSteps = [];
                        let lvl2Steps = [];
                        let lvl10Steps = [];
                        let lvl20Steps = [];
                        
                        let currentMult = 1.0; 
                        let xpForLvl2 = baseXP;
                        let xpForLvl10 = baseXP + (gFactor * 8); 
                        let xpForLvl20 = baseXP + (gFactor * 18); 

                        for(let lv=0; lv<5; lv++) {
                            currentMult += levels[lv];
                            multSteps.push("x" + currentMult.toFixed(2));
                            
                            lvl2Steps.push(Math.ceil(xpForLvl2 / currentMult));
                            lvl10Steps.push(Math.ceil(xpForLvl10 / currentMult));
                            lvl20Steps.push(Math.ceil(xpForLvl20 / currentMult));
                        }

                        text = "<b>Множитель Опыта от Карточки</b>:<br>" + multSteps.join(" ➔ ") + 
                               "<br><br><b>Алмазов до 2 Ур. (надо " + xpForLvl2.toFixed(1) + " XP)</b>:<br>" + lvl2Steps.join(" ➔ ") +
                               "<br><br><b>Алмазов до 10 Ур. (надо " + xpForLvl10.toFixed(1) + " XP)</b>:<br>" + lvl10Steps.join(" ➔ ") +
                               "<br><br><b>Алмазов до 20 Ур. (надо " + xpForLvl20.toFixed(1) + " XP)</b>:<br>" + lvl20Steps.join(" ➔ ");
                    }
                    else if (u.type === "Piercing") {
                        // ФИКС: раньше показывался только счётчик пробития. У Piercing есть
                        // ВТОРОЙ, скрытый эффект в коде игры (PlayerRicochet.UpgradePiercing):
                        // он же увеличивает радиус рикошета на (levelValue * radiusBonusPerUpgrade) —
                        // это нигде не отображалось.
                        let bonusInput = document.getElementById('ps_rBonus');
                        let radiusInput = document.getElementById('ps_rRadius');
                        let bonusPerUpgrade = bonusInput ? clean(bonusInput.value) : (currentData.playerStats ? currentData.playerStats.radiusBonusPerUpgrade : 0);
                        let baseRadius = radiusInput ? clean(radiusInput.value) : (currentData.playerStats ? currentData.playerStats.ricochetRadius : 0);

                        let currentPierce = hasTestBase ? tBase : 0;
                        let currentRadius = baseRadius;
                        let pierceSteps = [];
                        let radiusSteps = [];
                        for (let lv = 0; lv < 5; lv++) {
                            currentPierce += levels[lv];
                            currentRadius += levels[lv] * bonusPerUpgrade;
                            pierceSteps.push((hasTestBase ? "" : "+") + currentPierce);
                            radiusSteps.push(currentRadius.toFixed(1));
                        }
                        text = "<b>Пробитие (целей)</b>" + (hasTestBase ? " (ТЕСТ, база " + tBase + ")" : "") + ":<br>" + pierceSteps.join(" ➔ ") +
                               "<br><br><b>⚠️ Побочный эффект — радиус рикошета</b> (база " + baseRadius.toFixed(1) + "):<br>" + radiusSteps.join(" ➔ ");
                    }
                    else if (u.type === "Ricochet") {
                        let currentVal = hasTestBase ? tBase : 0;
                        let steps = [];
                        for (let lv = 0; lv < 5; lv++) {
                            currentVal += levels[lv];
                            steps.push((hasTestBase ? "" : "+") + currentVal);
                        }
                        // Крит переехал сюда с Дальности. В игре это
                        // finalHeadChance = ricochetHeadChance + BonusHeadChance,
                        // где BonusHeadChance копится по critPerRicochetLevel за уровень.
                        let headInput = document.getElementById('ps_rHead');
                        let baseHead = headInput ? clean(headInput.value)
                                                 : (currentData.playerStats ? currentData.playerStats.ricochetHeadChance : 15);
                        let critInput = document.getElementById('ps_critPerRico');
                        let perLevel = critInput ? clean(critInput.value)
                                                 : (currentData.playerStats && currentData.playerStats.critPerRicochetLevel !== undefined
                                                    ? currentData.playerStats.critPerRicochetLevel : 6);
                        let critSteps = [];
                        for (let lv = 0; lv < 5; lv++) critSteps.push((baseHead + perLevel * (lv + 1)).toFixed(1) + "%");

                        text = "<b>Рикошетов (доп. целей)</b>" + (hasTestBase ? " (ТЕСТ, база " + tBase + ")" : "") + ":<br>" + steps.join(" ➔ ") +
                               "<br><br><b>Шанс Голова (Крит)</b> (база " + baseHead + "% + " + perLevel + "% за уровень):<br>" + critSteps.join(" ➔ ");
                    }
                    else if (u.type === "Regeneration") {
                        let currentVal = hasTestBase ? tBase : 0;
                        let steps = [];
                        for (let lv = 0; lv < 5; lv++) {
                            currentVal += levels[lv];
                            steps.push((hasTestBase ? "" : "+") + currentVal.toFixed(2));
                        }
                        text = "<b>Реген HP / сек</b>" + (hasTestBase ? " (ТЕСТ, база " + tBase + ")" : "") + ":<br>" + steps.join(" ➔ ");
                    }
                    else if (u.type === "CrystalRadius") {
                        // База 6 — Crystal.baseAttractDistance, хардкод в префабе, отсюда не настраивается.
                        let baseRadius = hasTestBase ? tBase : 6;
                        let currentVal = baseRadius;
                        let steps = [];
                        for (let lv = 0; lv < 5; lv++) {
                            currentVal += levels[lv];
                            steps.push(currentVal.toFixed(1));
                        }
                        text = "<b>Радиус сбора кристаллов</b>" + (hasTestBase ? " (ТЕСТ)" : " (база 6 — хардкод Crystal.cs)") + ":<br>" + steps.join(" ➔ ");
                    }
                    else if (u.type === "StunDuration") {
                        // База 0.15 — EnemyHealth.hitStunDuration, хардкод на враге, отсюда не настраивается.
                        let baseStun = hasTestBase ? tBase : 0.15;
                        let currentVal = baseStun;
                        let steps = [];
                        for (let lv = 0; lv < 5; lv++) {
                            currentVal += levels[lv];
                            steps.push(currentVal.toFixed(2));
                        }
                        text = "<b>Стан врагов (сек)</b>" + (hasTestBase ? " (ТЕСТ)" : " (база 0.15 — хардкод EnemyHealth.cs)") + ":<br>" + steps.join(" ➔ ");
                    }
                    else if (u.type === "UltimateUpgrade") {
                        // Формула из PlayerUltimate.ApplyUltimateUpgrade: cooldownMultiplier -= value,
                        // с ограничением снизу — кулдаун не может уйти ниже x0.1 от базового.
                        let currentMult = 1.0;
                        let steps = [];
                        for (let lv = 0; lv < 5; lv++) {
                            currentMult -= levels[lv];
                            if (currentMult < 0.1) currentMult = 0.1;
                            steps.push("x" + currentMult.toFixed(2));
                        }
                        text = "<b>Множитель кулдауна Ульты</b> (не ниже x0.1):<br>" + steps.join(" ➔ ") +
                               "<br><br><i>+2.5м к радиусу ульты за каждый уровень — захардкожено в коде, отсюда не меняется.</i>";
                    }
                    else {
                        let currentVal = hasTestBase ? tBase : 0;
                        let steps = [];
                        for(let lv=0; lv<5; lv++) {
                            currentVal += levels[lv];
                            let formatted = Number.isInteger(currentVal) ? currentVal : currentVal.toFixed(2);
                            steps.push(hasTestBase ? formatted : "+" + formatted);
                        }
                        text = hasTestBase ? "<b>🧪 ТЕСТ (База " + tBase + ")</b>:<br>" + steps.join(" ➔ ") : "<b>Суммарная прибавка</b>:<br>" + steps.join(" ➔ ");
                    }
                    previewDiv.innerHTML = text;
                });
            } catch (err) {
                console.error("Ошибка калькулятора (не ломает логику):", err);
            }
        }

        function exportBackup() { try { syncData(); if(!currentData) return; const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2)); const dlAnchorElem = document.createElement('a'); dlAnchorElem.setAttribute("href", dataStr); dlAnchorElem.setAttribute("download", "GameBalance_Backup_" + new Date().toISOString().slice(0,10) + ".json"); document.body.appendChild(dlAnchorElem); dlAnchorElem.click(); dlAnchorElem.remove(); } catch(e){} }
        function importBackup(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { try { currentData = JSON.parse(e.target.result); render(); document.getElementById('status').innerText = "✅ Бэкап загружен в интерфейс! Нажмите СОХРАНИТЬ В GITHUB."; document.getElementById('status').style.color = "#4ec9b0"; event.target.value = ''; } catch (err) { alert("Ошибка чтения файла!"); } }; reader.readAsText(file); }

        async function load() { 
            if(!token) { token = prompt("Введите GitHub Token:"); if(token) localStorage.setItem('gh_token', token); } 
            if(!token) return; 
            document.getElementById('status').innerText = "🔄 Загрузка..."; 
            document.getElementById('status').style.color = "#dcdcaa"; 
            try { 
                const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers: { Authorization: 'token '+token }}); 
                if(!res.ok) throw new Error("Ошибка доступа"); 
                const gist = await res.json(); 
                currentData = JSON.parse(gist.files[FILE_NAME].content); 
                render(); 
                try { promoteLastCard(); } catch(e) {}
                try { snapshotBaseline(); } catch(e) {} 
                document.getElementById('status').innerText = "✅ Данные загружены!"; 
                document.getElementById('status').style.color = "#4ec9b0"; 
                setTimeout(() => document.getElementById('status').innerText = "", 2000); 
            } catch (e) { 
                document.getElementById('status').innerText = "❌ Ошибка загрузки"; 
                document.getElementById('status').style.color = "#f48771"; 
            } 
        }

        async function saveData() { 
            syncData(); 
            document.getElementById('status').innerText = "⏳ Сохранение..."; 
            document.getElementById('status').style.color = "#dcdcaa"; 
            try { 
                const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, { method: 'PATCH', headers: { Authorization: 'token '+token }, body: JSON.stringify({ files: { [FILE_NAME]: { content: JSON.stringify(currentData, null, 2) } } }) }); 
                if(res.ok) { 
                    document.getElementById('status').innerText = "✅ УСПЕШНО СОХРАНЕНО!"; 
                    document.getElementById('status').style.color = "#238636"; 
                    undoStack = [];
                    document.getElementById('btn-undo').style.display = 'none';
                    // Сохранённое стало новой точкой отсчёта — кнопки отката гаснут
                    try { snapshotBaseline(); } catch(e) {}
                } else throw new Error(); 
            } catch (e) { 
                document.getElementById('status').innerText = "❌ ОШИБКА СОХРАНЕНИЯ!"; 
                document.getElementById('status').style.color = "#f48771"; 
            } 
        }

        load();
    </script>
