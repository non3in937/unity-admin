<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Unity Config Admin PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { background: #1e1e1e; color: #d4d4d4; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .panel { background: #2d2d30; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #3e3e42; position: relative; }
        .drag-handle { cursor: grab; padding: 10px; color: #569cd6; font-size: 20px; display: flex; align-items: center; justify-content: center; background: #3e3e42; border-radius: 4px; margin-right: 15px;}
        h2 { color: #569cd6; text-align: center; margin-bottom: 10px; }
        h3 { color: #4ec9b0; margin: 0; }
        label { display: block; margin-bottom: 5px; font-size: 11px; color: #9cdcfe; white-space: nowrap; }
        input, select { background: #3e3e42; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 13px;}
        select { cursor: pointer; appearance: none; }
        
        .btn-main { background: #238636; color: white; width: 100%; padding: 15px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; font-size: 16px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.2s;}
        .btn-main:hover { background: #2ea043; }

        .btn-undo { background: #c586c0; color: white; width: 100%; padding: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; font-size: 15px; margin-bottom: 15px; display: none; transition: transform 0.1s;}
        .btn-undo:active { transform: scale(0.98); }

        .tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px; background: #2d2d30; color: #888; border: none; cursor: pointer; border-radius: 4px 4px 0 0; min-width: 80px;}
        .tab-btn.active { background: #1e1e1e; color: #fff; border-bottom: 3px solid #4ec9b0; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .row { display: flex; gap: 10px; align-items: flex-start; }
        .header-row { display: flex; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #3e3e42; padding-bottom: 10px; }
        .btn-add { background: #1f6b35; color: white; width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: bold;}
        .btn-remove { background: #8a2a2a; color: white; padding: 8px; border: none; border-radius: 4px; cursor: pointer; }
        .status { text-align: center; font-weight: bold; margin-bottom: 15px; }
        
        .backup-btn { background: #0e639c; color: white; width: 100%; padding: 15px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; font-size: 16px; margin-bottom: 20px;}
        .file-input-wrapper { background: #1e1e1e; border: 1px dashed #ce9178; padding: 20px; text-align: center; border-radius: 8px; margin-top: 10px;}

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .upgrade-card { background: #252526; border: 2px solid #3e3e42; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; }
        .upgrade-card.disabled { opacity: 0.6; border-color: #555 !important; }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3e3e42; padding-bottom: 10px; margin-bottom: 15px; }
        .card-title { font-size: 16px; font-weight: bold; color: #4ec9b0; margin: 0; display: flex; align-items: center; gap: 8px; }
        .card-levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-levels .full-width { grid-column: span 2; }
        .card-levels label { color: #dcdcaa; }

        .preview-box { background: #1e1e1e; border-radius: 4px; padding: 10px; margin-top: 10px; font-size: 12px; color: #888; border-left: 3px solid #4ec9b0; }
        .test-base-input { border: 1px dashed #dcdcaa !important; background: #252526 !important; margin-bottom: 15px !important;}
        
        .player-card { border-color: #4ec9b0; } 
        .weapon-card { border-color: #ce9178; } 
        .upgrade-card:not(.player-card):not(.weapon-card):not(.evo-card) { border-color: #569cd6; } 
        .evo-card { background: #201a23; }
        
        .folder-container { transition: all 0.3s ease; }
        .folder-container.disabled-folder { opacity: 0.5; }

        /* 🔥 СТИЛИ БОССОВ И ПОДСКАЗОК 🔥 */
        .boss-card { border-color: #f48771; }
        .phase-card { background: #1e1e1e; border-left: 3px solid #c586c0; margin-top: 10px; padding: 10px; border-radius: 4px; border: 1px solid #333; }
        .attack-card { background: #252526; border: 1px dashed #569cd6; margin-top: 10px; padding: 10px; border-radius: 4px; }
        
        /* НОВАЯ КРУПНАЯ КНОПКА ПОДСКАЗКИ */
        .ttip { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #3e3e42; border: 1px solid #555; border-radius: 4px; color: #569cd6; font-size: 16px; width: 36px; height: 36px; flex-shrink: 0; outline: none; margin-left: 5px; }
        .ttip .ttiptext { visibility: hidden; width: 220px; background-color: #1e1e1e; color: #dcdcaa; text-align: center; border-radius: 6px; padding: 10px; position: absolute; z-index: 100; bottom: 130%; left: 50%; transform: translateX(-50%); border: 1px solid #569cd6; opacity: 0; transition: opacity 0.2s; font-weight: normal; font-size: 12px; white-space: normal; line-height: 1.4; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); pointer-events: none;}
        .ttip .ttiptext::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border-width: 5px; border-style: solid; border-color: #569cd6 transparent transparent transparent; }
        .ttip:hover .ttiptext, .ttip:focus .ttiptext { visibility: visible; opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ Remote Admin PRO</h2>
        
        <button class="btn-main" onclick="saveData()">💾 СОХРАНИТЬ ВСЁ В GITHUB</button>
        <div id="status" class="status"></div>
        
        <div class="tabs">
            <button class="tab-btn active" id="btn-waves" onclick="switchTab('waves')">🌊 Волны</button>
            <button class="tab-btn" id="btn-player" onclick="switchTab('player')">🏃 Игрок</button>
            <button class="tab-btn" id="btn-weapons" onclick="switchTab('weapons')">🔫 Оружие</button>
            <button class="tab-btn" id="btn-upgrades" onclick="switchTab('upgrades')">🃏 Карты</button>
            <button class="tab-btn" id="btn-evos" onclick="switchTab('evos')" style="color:#c586c0;">🧬 EVO</button>
            <button class="tab-btn" id="btn-bosses" onclick="switchTab('bosses')" style="color:#f48771;">👹 Боссы</button>
            <button class="tab-btn" id="btn-backups" onclick="switchTab('backups')" style="color:#ce9178;">🛡️ Бэкапы</button>
        </div>

        <div id="tab-waves" class="tab-content active">
            <button class="btn-undo" id="btn-undo" onclick="undo()">↩️ ОТМЕНИТЬ СЛУЧАЙНОЕ УДАЛЕНИЕ</button>
            <div id="waves-list"></div>
            <button class="btn-add" onclick="addFolder()" style="background:#0e639c; margin-top:20px; font-size:16px;">📁 Добавить Новую Папку</button>
        </div>
        <div id="tab-player" class="tab-content"></div>
        <div id="tab-weapons" class="tab-content"></div>
        <div id="tab-upgrades" class="tab-content"></div>
        <div id="tab-evos" class="tab-content"></div>
        <div id="tab-bosses" class="tab-content"></div>
        
        <div id="tab-backups" class="tab-content">
            <div class="panel">
                <h3 style="color:#569cd6; margin-bottom:10px; text-align:center;">📦 Сохранение и Восстановление</h3>
                <button class="backup-btn" onclick="exportBackup()">📥 СКАЧАТЬ БЭКАП (.json)</button>
                <div class="file-input-wrapper">
                    <input type="file" id="importFile" accept=".json" style="background:transparent; border:none; color:#4ec9b0;" onchange="importBackup(event)">
                </div>
            </div>
        </div>
    </div>

    <script>
        const GIST_ID = '4b5faafac858635664755b821b757d35';
        const FILE_NAME = 'config.json';
        const ENEMY_IDS = ["Enemy_Standard", "Enemy_Runner", "Enemy_armor", "Enemy_Tank_Explotion", "Enemy_Tank_Toxic", "Enemy_Drone", "Helth", "Weapon"];
        const ATTACK_TYPES = ["Rift", "Laser", "EarthThrow", "Rockets", "SummonHorde"];

        let currentData = null;
        let token = localStorage.getItem('gh_token');
        let undoStack = []; 

        function switchTab(t) {
            try { syncData(); } catch(e) {}
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('btn-' + t)?.classList.add('active');
            document.getElementById('tab-' + t)?.classList.add('active');
            try { render(); updatePreviews(); } catch(e) {}
        }

        function clean(val) { let parsed = parseFloat(String(val).replace(',', '.')); return isNaN(parsed) ? 0 : parsed; }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = Math.floor(seconds % 60);
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        function updatePhaseTime(inputEl) {
            let panel = inputEl.closest('.phase-panel');
            if (!panel) return;
            let start = parseFloat(panel.querySelector('.p-start').value) || 0;
            let end = parseFloat(panel.querySelector('.p-end').value) || 0;
            panel.querySelector('.phase-time').innerText = formatTime(start) + " - " + formatTime(end);
        }

        function saveStateForUndo() {
            try { syncData(); } catch(e){}
            undoStack.push(JSON.stringify(currentData.phases));
            document.getElementById('btn-undo').style.display = 'block';
        }

        function undo() {
            if (undoStack.length === 0) return;
            D.phases = JSON.parse(undoStack.pop());
            render();
            if (undoStack.length === 0) document.getElementById('btn-undo').style.display = 'none';
        }

        function removeFolder(btn, event) { event.stopPropagation(); saveStateForUndo(); btn.closest('.folder-container').remove(); syncData(); }
        function removePhase(btn) { saveStateForUndo(); btn.closest('.phase-panel').remove(); syncData(); }

        function togglePanelDisplay(headerEl, storageKey) {
            let content = headerEl.nextElementSibling;
            let icon = headerEl.querySelector('.fold-icon');
            let id = headerEl.dataset.foldid;
            let collapsed = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (content.style.display === 'none') {
                content.style.display = 'block'; icon.innerText = '▼'; collapsed = collapsed.filter(n => n !== id); 
            } else {
                content.style.display = 'none'; icon.innerText = '▶'; if (!collapsed.includes(id)) collapsed.push(id); 
            }
            localStorage.setItem(storageKey, JSON.stringify(collapsed));
        }

        function toggleFolderEnabled(checkbox, event) {
            event.stopPropagation();
            checkbox.closest('.folder-container').classList.toggle('disabled-folder', !checkbox.checked);
        }

        function ensureEvoData() {
            if (!currentData.evos) {
                currentData.evos = {
                    absoluteControl: { evoRegeneration: 5, evoStunDuration: 3 },
                    hurricaneStrafe: { evoStrafeSpeed: 35, pistolFireRate: 0.1, autoFireRate: 0.05, shotgunFireRate: 0.2 },
                    leadDrill: { infinitePiercingValue: 100, evoBushSpeed: 12 },
                    homing: { evoRicochetCount: 15, evoRicochetRadius: 40, evoBonusHeadChance: 50, evoSpreadMultiplier: 0, pistolDistance: 150, autoDistance: 100, shotgunDistance: 60 },
                    tank: { explosionDamage: 75, explosionRadius: 3.5, explosionShakeMagnitude: 0, explosionShakeDuration: 0 }
                };
            }
        }

        function syncData() {
            if(!currentData) return;
            if(!currentData.bosses) currentData.bosses = [];
            
            try {
                if(document.getElementById('bosses-container')) {
                    let newBosses = [];
                    document.querySelectorAll('.boss-panel').forEach(bEl => {
                        let boss = { bossID: bEl.querySelector('.b-id').value, spawnTime: clean(bEl.querySelector('.b-time').value), phases: [] };
                        bEl.querySelectorAll('.phase-panel').forEach(pEl => {
                            let phase = { phaseName: pEl.querySelector('.p-name').value, startAtHpPercent: clean(pEl.querySelector('.p-start-hp').value), endAtHpPercent: clean(pEl.querySelector('.p-end-hp').value), timeBetweenAttacks: clean(pEl.querySelector('.p-delay').value), attackSequence: [] };
                            pEl.querySelectorAll('.attack-panel').forEach(aEl => {
                                let attack = { attackType: aEl.querySelector('.a-type').value };
                                aEl.querySelectorAll('.a-param').forEach(paramEl => {
                                    attack[paramEl.dataset.key] = paramEl.type === 'checkbox' ? paramEl.checked : clean(paramEl.value);
                                });
                                phase.attackSequence.push(attack);
                            });
                            boss.phases.push(phase);
                        });
                        newBosses.push(boss);
                    });
                    currentData.bosses = newBosses;
                }
            } catch(e) {}

            try {
                if(document.querySelector('#waves-list .folder-container')) {
                    let newPhases = [];
                    document.querySelectorAll('.folder-container').forEach(folderEl => {
                        let folderName = folderEl.querySelector('.f-name').value;
                        let folderEnabled = folderEl.querySelector('.f-enabled').checked;
                        folderEl.querySelectorAll('.phase-panel').forEach(panel => {
                            let phase = { phaseName: panel.querySelector('.p-name').value, startTime: clean(panel.querySelector('.p-start').value), endTime: clean(panel.querySelector('.p-end').value), spawnInterval: clean(panel.querySelector('.p-int').value), enemiesPerBatch: parseInt(panel.querySelector('.p-batch').value) || 1, enemies: [], folder: folderName, isEnabled: folderEnabled };
                            panel.querySelectorAll('.enemy-row').forEach(row => { phase.enemies.push({ enemyID: row.querySelector('.e-id').value, weight: clean(row.querySelector('.e-w').value) }); });
                            newPhases.push(phase);
                        });
                    });
                    currentData.phases = newPhases;
                }
            } catch(e) {}
            
            try {
                let getVal = (id, fb) => { let el = document.getElementById(id); return el ? clean(el.value) : fb; };
                if(document.getElementById('ps_fSpeed')) {
                    let s = currentData.playerStats;
                    s.forwardSpeed = getVal('ps_fSpeed', s.forwardSpeed); s.strafeSpeed = getVal('ps_sSpeed', s.strafeSpeed);
                    s.bodyTurnSpeed = getVal('ps_bTurn', s.bodyTurnSpeed || 10); s.maxBodyTurnAngle = getVal('ps_mAng', s.maxBodyTurnAngle || 45);
                    s.maxHealth = parseInt(getVal('ps_mHealth', s.maxHealth)); s.maxShields = parseInt(getVal('ps_mShields', s.maxShields)); s.shieldRegenTime = getVal('ps_sRegen', s.shieldRegenTime);
                    s.ricochetRadius = getVal('ps_rRadius', s.ricochetRadius); s.radiusBonusPerUpgrade = getVal('ps_rBonus', s.radiusBonusPerUpgrade); s.ricochetHeadChance = getVal('ps_rHead', s.ricochetHeadChance); s.ricochetLegChance = getVal('ps_rLeg', s.ricochetLegChance);
                    s.baseXP = getVal('ps_bXP', s.baseXP || 5); s.growthFactor = getVal('ps_gFactor', s.growthFactor || 10);
                }
            } catch(e) {}

            try {
                if(document.querySelector('.w-dmg') && currentData.weapons) {
                    currentData.weapons.forEach((w, i) => {
                        let dmgEl = document.getElementById('w_dmg_' + i);
                        if(dmgEl) { w.damage = clean(dmgEl.value); w.fireRate = clean(document.getElementById('w_fr_' + i).value); w.maxDistance = clean(document.getElementById('w_dist_' + i).value); w.spread = clean(document.getElementById('w_spr_' + i).value); }
                    });
                }
            } catch(e) {}

            try {
                if(document.getElementById('u_en_0') && currentData.upgrades) {
                    currentData.upgrades.forEach((u, i) => {
                        let enEl = document.getElementById('u_en_' + i);
                        if(enEl) { u.isEnabled = enEl.checked; let levelsArr = []; for(let lv=0; lv<5; lv++) { let lvEl = document.getElementById('u_lv_' + i + '_' + lv); levelsArr.push(lvEl ? clean(lvEl.value) : 0); } u.levelValues = levelsArr; }
                    });
                }
            } catch(e) {}
        }

        // 🔥 ФУНКЦИЯ-ГЕНЕРАТОР ПОЛЯ С ПОДСКАЗКОЙ 🔥
        function makeField(label, key, val, hintText, isCheckbox = false) {
            let inputHtml = isCheckbox 
                ? `<input type="checkbox" class="a-param" data-key="${key}" ${val !== false ? 'checked' : ''} style="width:24px; height:24px; margin:0;">`
                : `<input type="number" step="0.1" class="a-param" data-key="${key}" value="${val}" style="flex:1; margin:0; height:36px; box-sizing:border-box;">`;
            
            let hintHtml = hintText ? `<div class="ttip" tabindex="0">❔<span class="ttiptext">${hintText}</span></div>` : '';

            return `
            <div style="flex:1; display:flex; flex-direction:column; min-width:30%;">
                <label style="margin-bottom:4px; font-size:11px;">${label}</label>
                <div style="display:flex; align-items:center;">
                    ${inputHtml}
                    ${hintHtml}
                </div>
            </div>`;
        }

        // 🔥 ПОЛНЫЙ ВЫВОД АТАК ЧЕРЕЗ ГЕНЕРАТОР 🔥
        function generateAttackHtml(attack) {
            let opts = ATTACK_TYPES.map(t => `<option value="${t}" ${t===attack.attackType?'selected':''}>${t}</option>`).join('');
            let paramsHtml = '';
            
            if (attack.attackType === 'Laser') {
                paramsHtml = `
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Prep Time', 'laserPreparationTime', attack.laserPreparationTime ?? 1.5, 'Секунды до выстрела (красная линия).')}
                    ${makeField('Duration', 'laserDuration', attack.laserDuration ?? 5.0, 'Длительность лазера.')}
                    ${makeField('Rot. Speed', 'laserRotationSpeed', attack.laserRotationSpeed ?? 45, 'Скорость вращения.')}
                </div>
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Beam Width', 'laserBeamWidth', attack.laserBeamWidth ?? 3.0, 'Толщина луча.')}
                    ${makeField('Beam Length', 'laserBeamLength', attack.laserBeamLength ?? 40.0, 'Длина луча.')}
                    ${makeField('Beam Count', 'laserBeamCount', attack.laserBeamCount ?? 1, 'Кол-во лучей (1=линия, 4=крест).')}
                </div>
                <div class="row">
                    ${makeField('Dmg / Tick', 'laserDamagePerTick', attack.laserDamagePerTick ?? 1, 'Урон за касание.')}
                    ${makeField('Tick Rate', 'laserTickRate', attack.laserTickRate ?? 0.5, 'Задержка между получением урона.')}
                    <div style="flex:1"></div>
                </div>`;
            } 
            else if (attack.attackType === 'Rift') {
                paramsHtml = `
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Prep Time', 'riftPreparationTime', attack.riftPreparationTime ?? 2.0, 'Задержка перед шипами.')}
                    ${makeField('Path Width', 'riftPathWidth', attack.riftPathWidth ?? 4.0, 'Ширина опасной зоны.')}
                    ${makeField('Path Count', 'riftPathCount', attack.riftPathCount ?? 3, 'Кол-во путей.')}
                </div>
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Angle', 'riftAngleBetweenPaths', attack.riftAngleBetweenPaths ?? 45, 'Угол между путями.')}
                    ${makeField('Max Dist.', 'riftMaxDistance', attack.riftMaxDistance ?? 30.0, 'Дальность.')}
                    ${makeField('Spike Speed', 'riftSpikeSpeed', attack.riftSpikeSpeed ?? 20.0, 'Скорость шипов.')}
                </div>
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Lifetime', 'riftSpikeLifetime', attack.riftSpikeLifetime ?? 4.0, 'Время жизни шипа.')}
                    ${makeField('Spacing', 'riftSpikeSpacing', attack.riftSpikeSpacing ?? 1.5, 'Расстояние между рядами.')}
                    ${makeField('Per Row', 'riftSpikesPerRow', attack.riftSpikesPerRow ?? 3, 'Шипов в ширину.')}
                </div>
                <div class="row">
                    ${makeField('Scatter', 'riftRandomScatter', attack.riftRandomScatter ?? 0.5, 'Кривизна линии.')}
                    <div style="flex:2"></div>
                </div>`;
            } 
            else if (attack.attackType === 'EarthThrow') {
                paramsHtml = `
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Stone Count', 'stonesCount', attack.stonesCount ?? 3, 'Кол-во камней.')}
                    ${makeField('Delay Btw', 'stonesDelayBetween', attack.stonesDelayBetween ?? 2.0, 'Задержка между бросками.')}
                    ${makeField('Track Dur.', 'stonesTrackingDuration', attack.stonesTrackingDuration ?? 1.5, 'Время прицеливания.')}
                </div>
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Lead Str.', 'stonesLeadStrength', attack.stonesLeadStrength ?? 1.2, 'Упреждение (1.0 = точно в цель).')}
                    ${makeField('Indicator', 'stonesIndicatorSize', attack.stonesIndicatorSize ?? 3.0, 'Радиус взрыва камня.')}
                    ${makeField('Fly Speed', 'stonesSpeed', attack.stonesSpeed ?? 25.0, 'Скорость полета.')}
                </div>
                <div class="row">
                    ${makeField('Damage', 'stonesDamage', attack.stonesDamage ?? 2, 'Урон при прямом попадании.')}
                    <div style="flex:2"></div>
                </div>`;
            } 
            else if (attack.attackType === 'Rockets') {
                paramsHtml = `
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Count', 'rocketsLaunchCount', attack.rocketsLaunchCount ?? 5, 'Сколько ракет за залп.')}
                    ${makeField('Ln. Speed', 'rocketsLaunchSpeed', attack.rocketsLaunchSpeed ?? 30.0, 'Скорость вылета вверх.')}
                    ${makeField('Ln. Delay', 'rocketsLaunchDelay', attack.rocketsLaunchDelay ?? 0.2, 'Задержка между вылетами.')}
                </div>
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Scatter', 'rocketsLaunchScatter', attack.rocketsLaunchScatter ?? 20.0, 'Разброс при запуске.')}
                    ${makeField('Warn Count', 'rocketsWarningCount', attack.rocketsWarningCount ?? 5, 'Кол-во красных кругов.')}
                    ${makeField('Warn Dur.', 'rocketsWarningDuration', attack.rocketsWarningDuration ?? 2.5, 'Как долго круг мигает.')}
                </div>
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Expl. Rad', 'rocketsExplosionRadius', attack.rocketsExplosionRadius ?? 6.0, 'Радиус взрыва.')}
                    ${makeField('Fall Spd', 'rocketsFallSpeed', attack.rocketsFallSpeed ?? 50.0, 'Скорость падения.')}
                    ${makeField('Fall Delay', 'rocketsFallDelay', attack.rocketsFallDelay ?? 0.2, 'Задержка падения.')}
                </div>
                <div class="row">
                    ${makeField('Damage', 'rocketsDamage', attack.rocketsDamage ?? 2, 'Урон от взрыва.')}
                    ${makeField('Show Zone', 'rocketsShowDebug', attack.rocketsShowDebug, 'Показывать сферу взрыва.', true)}
                    <div style="flex:1"></div>
                </div>`;
            } 
            else if (attack.attackType === 'SummonHorde') {
                paramsHtml = `
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Enemy Cnt', 'hordeEnemyCount', attack.hordeEnemyCount ?? 4, 'Сколько врагов вылезет.')}
                    ${makeField('Lifetime', 'hordeEnemyLifetime', attack.hordeEnemyLifetime ?? 12.0, 'Через сколько умрут.')}
                    ${makeField('Delay Btw', 'hordeDelayBetweenSpawns', attack.hordeDelayBetweenSpawns ?? 0.5, 'Пауза между появлением.')}
                </div>
                <div class="row" style="margin-bottom:10px;">
                    ${makeField('Emerge Time', 'hordeEmergeTime', attack.hordeEmergeTime ?? 1.5, 'Скорость вылезания.')}
                    ${makeField('Ambush %', 'hordeAmbushChance', attack.hordeAmbushChance ?? 0.6, 'Шанс засады (0.0-1.0).')}
                    ${makeField('Main Shake', 'hordeShakeIntensity', attack.hordeShakeIntensity ?? 0.15, 'Сила главной тряски.')}
                </div>
                <div class="row">
                    ${makeField('Main Dur.', 'hordeShakeDuration', attack.hordeShakeDuration ?? 0.4, 'Время главной тряски.')}
                    ${makeField('Mic. Shake', 'hordeMicroShakeIntensity', attack.hordeMicroShakeIntensity ?? 0.05, 'Микротряска (вылезание).')}
                    ${makeField('Mic. Dur.', 'hordeMicroShakeDuration', attack.hordeMicroShakeDuration ?? 0.1, 'Микротряска (время).')}
                </div>`;
            }

            return `<div class="attack-card attack-panel">
                <div class="row" style="margin-bottom:10px;">
                    <span style="color:#569cd6; font-size:18px;">⚔️</span>
                    <select class="a-type" style="flex:1; margin:0;" onchange="syncData(); render();">${opts}</select>
                    <button class="btn-remove" onclick="this.closest('.attack-panel').remove(); syncData(); render();">✖</button>
                </div>
                ${paramsHtml}
            </div>`;
        }

        function render() {
            if(!currentData) return;
            ensureEvoData();
            if (!currentData.bosses) currentData.bosses = [];

            if (document.getElementById('tab-bosses').classList.contains('active')) {
                let bh = '<div id="bosses-container">';
                let colB = JSON.parse(localStorage.getItem('colBoss') || '[]');
                let colP = JSON.parse(localStorage.getItem('colPhase') || '[]');

                currentData.bosses.forEach((boss, bIdx) => {
                    let bIdStr = "boss_" + bIdx;
                    let bIsCollapsed = colB.includes(bIdStr);
                    let bDisp = bIsCollapsed ? 'none' : 'block';
                    let bIcon = bIsCollapsed ? '▶' : '▼';

                    bh += `<div class="panel boss-panel boss-card" style="padding-bottom:5px;">
                        <div class="header-row" data-foldid="${bIdStr}" style="cursor:pointer; border-bottom:none; margin-bottom:0;" onclick="togglePanelDisplay(this, 'colBoss')">
                            <span class="fold-icon" style="color:#f48771; margin-right:10px; font-size:14px;">${bIcon}</span>
                            <span style="font-size: 20px; margin-right:5px;">👹</span>
                            <input type="text" class="b-id" value="${boss.bossID}" onclick="event.stopPropagation()" style="flex:2; font-weight:bold; color:#f48771; margin:0;">
                            <label style="margin:0 10px;" onclick="event.stopPropagation()">Сек:</label>
                            <input type="number" class="b-time" value="${boss.spawnTime}" onclick="event.stopPropagation()" style="flex:1; margin:0;">
                            <button class="btn-remove" onclick="event.stopPropagation(); this.closest('.boss-panel').remove(); syncData(); render();" style="margin-left:10px;">✖</button>
                        </div>
                        <div class="boss-content" style="display:${bDisp}; margin-top:15px; border-top: 1px solid #3e3e42; padding-top:15px;">
                            <div class="phases-list">`;
                    
                    boss.phases.forEach((phase, pIdx) => {
                        let pIdStr = "phase_" + bIdx + "_" + pIdx;
                        let pIsCollapsed = colP.includes(pIdStr);
                        let pDisp = pIsCollapsed ? 'none' : 'block';
                        let pIcon = pIsCollapsed ? '▶' : '▼';

                        bh += `<div class="phase-card phase-panel" style="padding-bottom:5px;">
                            <div class="row" data-foldid="${pIdStr}" style="align-items: center; cursor:pointer;" onclick="togglePanelDisplay(this, 'colPhase')">
                                <span class="fold-icon" style="color:#c586c0; margin-right:10px; font-size:12px;">${pIcon}</span>
                                <input type="text" class="p-name" value="${phase.phaseName}" onclick="event.stopPropagation()" style="flex:2; color:#c586c0; margin:0; font-weight:bold; background:transparent; border-color:#c586c0;">
                                <div style="flex:1; display:flex; flex-direction:column;" onclick="event.stopPropagation()"><label style="margin:0;">Start HP %</label><input type="number" class="p-start-hp" value="${phase.startAtHpPercent}" style="margin:0; border-color:#2ea043;"></div>
                                <div style="flex:1; display:flex; flex-direction:column;" onclick="event.stopPropagation()"><label style="margin:0;">End HP %</label><input type="number" class="p-end-hp" value="${phase.endAtHpPercent}" style="margin:0; border-color:#8a2a2a;"></div>
                                <div style="flex:1; display:flex; flex-direction:column;" onclick="event.stopPropagation()"><label style="margin:0;">Пауза</label><input type="number" step="0.1" class="p-delay" value="${phase.timeBetweenAttacks}" style="margin:0;"></div>
                                <button class="btn-remove" onclick="event.stopPropagation(); this.closest('.phase-panel').remove(); syncData(); render();" style="margin-left:10px;">✖</button>
                            </div>
                            <div class="phase-content" style="display:${pDisp}; margin-top:10px; border-top: 1px dashed #555; padding-top:10px;"><div class="attacks-list">`;
                        
                        phase.attackSequence.forEach(attack => bh += generateAttackHtml(attack));
                        bh += `</div><button class="btn-add" onclick="addAttack(this)" style="background:#0e639c; padding:5px; font-size:12px; margin-top:10px;">+ Атака</button></div></div>`;
                    });
                    bh += `</div><button class="btn-add" onclick="addPhase(this)" style="background:#569cd6; margin-top:10px;">+ Фаза</button></div></div>`;
                });
                bh += `</div><button class="btn-main" onclick="addBoss()">➕ ДОБАВИТЬ БОССА</button>`;
                document.getElementById('tab-bosses').innerHTML = bh;
            }
            
            // ... (ТУТ ВЕСЬ ОСТАЛЬНОЙ РЕНДЕР: Волны, Оружие, Игрок)
            // Код отрисовки остальных вкладок сжат для экономии места, но читаем:
            let h = '', f = {};
            if (currentData.phases && currentData.phases.length > 0) currentData.phases.forEach(p => { let n = p.folder || "Main"; if (!f[n]) f[n] = { isEnabled: p.isEnabled !== false, phases: [] }; f[n].phases.push(p); }); else f["Main"] = { isEnabled: true, phases: [] };
            let cf = JSON.parse(localStorage.getItem('collapsedFolders') || '[]');
            for (let n in f) {
                let d = f[n], ic = cf.includes(n), ds = ic ? 'none' : 'block', it = ic ? '▶' : '▼';
                h += `<div class="folder-container panel ${d.isEnabled?'':'disabled-folder'}" style="background:#252526; border-left: 4px solid #c586c0; padding:10px;"><div class="header-row" style="cursor:pointer; border-bottom:none; margin-bottom:0; padding-bottom:0;" onclick="toggleFolder(this)"><div class="drag-handle folder-drag" style="color:#c586c0;">☰</div><span class="fold-icon" data-foldid="${n}" style="color:#c586c0; margin-right:10px; font-size:12px;">${it}</span><input type="text" class="f-name" value="${n}" onclick="event.stopPropagation()" style="margin:0; font-weight:bold; flex:1; border-color:#c586c0; color:#c586c0; background:transparent;"><label style="margin: 0 15px; display:flex; align-items:center; cursor:pointer;" onclick="event.stopPropagation()"><input type="checkbox" class="f-enabled" ${d.isEnabled ? 'checked' : ''} onchange="toggleFolderEnabled(this, event)" style="width:16px;height:16px;margin:0 5px 0 0;"> ВКЛ</label><button class="btn-remove" onclick="removeFolder(this, event)">✖</button></div><div class="folder-content sortable-list" style="display:${ds}; margin-top:15px; min-height:10px; padding-left:15px; border-left:2px solid #3e3e42;">`;
                d.phases.forEach(p => { h += `<div class="panel phase-panel"><div class="header-row"><div class="drag-handle">☰</div><div style="flex:1; display:flex; flex-direction:column;"><span class="phase-time" style="font-size:11px; color:#dcdcaa; margin-bottom:3px; font-weight:bold;">00:00 - 00:00</span><input type="text" class="p-name" value="${p.phaseName}" style="margin:0; font-weight:bold;"></div><button class="btn-remove" onclick="removePhase(this)" style="margin-left:10px">✖</button></div><div class="row"><div style="flex:1"><label>Start</label><input type="number" step="0.1" class="p-start" value="${p.startTime||0}" oninput="updatePhaseTime(this)"></div><div style="flex:1"><label>End</label><input type="number" step="0.1" class="p-end" value="${p.endTime||0}" oninput="updatePhaseTime(this)"></div><div style="flex:1"><label>Interval</label><input type="number" step="0.1" class="p-int" value="${p.spawnInterval}"></div><div style="flex:1"><label>Batch</label><input type="number" class="p-batch" value="${p.enemiesPerBatch}"></div></div><div class="enemies-list">`; if (p.enemies) p.enemies.forEach(e => { let opts = ENEMY_IDS.map(id => `<option value="${id}" ${id===e.enemyID?'selected':''}>${id}</option>`).join(''); if(!ENEMY_IDS.includes(e.enemyID)) opts += `<option value="${e.enemyID}" selected>${e.enemyID}</option>`; h += `<div class="row enemy-row"><select class="e-id" style="flex:2">${opts}</select><input type="number" step="0.1" class="e-w" value="${e.weight}" style="flex:1"><button class="btn-remove" onclick="this.parentElement.remove()">✖</button></div>`; }); h += `</div><button class="btn-add" onclick="addEnemy(this)" style="font-size:12px; background:#1e1e1e; border: 1px solid #3e3e42;">+ Враг</button></div>`; });
                h += `</div><button class="btn-add folder-add-btn" onclick="addPhaseToFolder(this)" style="display:${ds}; background:#1f6b35;">➕ Добавить Волну</button></div>`;
            }
            document.getElementById('waves-list').innerHTML = h; document.querySelectorAll('.p-start').forEach(el => updatePhaseTime(el)); initSortable();
        }

        function addBoss() { if (!currentData.bosses) currentData.bosses = []; currentData.bosses.push({ bossID: "Boss_New", spawnTime: 300, phases: [{ phaseName: "Фаза 1", startAtHpPercent: 100, endAtHpPercent: 50, timeBetweenAttacks: 3, attackSequence: [] }] }); render(); }
        function addPhase(btn) { let p = btn.closest('.boss-panel'), i = Array.from(p.parentNode.children).indexOf(p), v = currentData.bosses[i].phases[currentData.bosses[i].phases.length - 1], s = v ? v.endAtHpPercent : 50; currentData.bosses[i].phases.push({ phaseName: "Новая Фаза", startAtHpPercent: s, endAtHpPercent: s / 2, timeBetweenAttacks: 2, attackSequence: [] }); render(); }
        function addAttack(btn) { let p = btn.closest('.phase-panel'), bp = p.closest('.boss-panel'), i = Array.from(bp.parentNode.children).indexOf(bp), j = Array.from(p.parentNode.children).indexOf(p) - 1; currentData.bosses[i].phases[j].attackSequence.push({ attackType: "Laser", laserRotationSpeed: 45, laserBeamCount: 1 }); render(); }
        function addFolder() { document.getElementById('waves-list').insertAdjacentHTML('beforeend', `<div class="folder-container panel" style="background:#252526; border-left: 4px solid #c586c0; padding:10px;"><div class="header-row" style="cursor:pointer; border-bottom:none; margin-bottom:0; padding-bottom:0;" onclick="toggleFolder(this)"><div class="drag-handle folder-drag" style="color:#c586c0;">☰</div><span class="fold-icon" style="color:#c586c0; margin-right:10px; font-size:12px;">▼</span><input type="text" class="f-name" value="New" onclick="event.stopPropagation()" style="margin:0; font-weight:bold; flex:1; border-color:#c586c0; color:#c586c0; background:transparent;"><label style="margin: 0 15px; display:flex; align-items:center; cursor:pointer;" onclick="event.stopPropagation()"><input type="checkbox" class="f-enabled" checked onchange="toggleFolderEnabled(this, event)" style="width:16px;height:16px;margin:0 5px 0 0;"> ВКЛ</label><button class="btn-remove" onclick="removeFolder(this, event)">✖</button></div><div class="folder-content sortable-list" style="margin-top:15px; min-height:10px; padding-left:15px; border-left:2px solid #3e3e42;"></div><button class="btn-add folder-add-btn" onclick="addPhaseToFolder(this)" style="background:#1f6b35;">➕ Добавить Волну</button></div>`); initSortable(); }
        function addPhaseToFolder(btn) { let c = btn.previousElementSibling; c.insertAdjacentHTML('beforeend', `<div class="panel phase-panel"><div class="header-row"><div class="drag-handle">☰</div><div style="flex:1; display:flex; flex-direction:column;"><span class="phase-time" style="font-size:11px; color:#dcdcaa; margin-bottom:3px; font-weight:bold;">00:00 - 00:00</span><input type="text" class="p-name" value="Wave" style="margin:0; font-weight:bold;"></div><button class="btn-remove" onclick="removePhase(this)" style="margin-left:10px">✖</button></div><div class="row"><div style="flex:1"><label>Start (sec)</label><input type="number" step="0.1" class="p-start" value="0" oninput="updatePhaseTime(this)"></div><div style="flex:1"><label>End (sec)</label><input type="number" step="0.1" class="p-end" value="60" oninput="updatePhaseTime(this)"></div><div style="flex:1"><label>Interval</label><input type="number" step="0.1" class="p-int" value="1"></div><div style="flex:1"><label>Batch</label><input type="number" class="p-batch" value="1"></div></div><div class="enemies-list"><div class="row enemy-row"><select class="e-id" style="flex:2">${ENEMY_IDS.map(i=>`<option value="${i}">${i}</option>`).join('')}</select><input type="number" step="0.1" class="e-w" value="100" style="flex:1"><button class="btn-remove" onclick="this.parentElement.remove()">✖</button></div></div><button class="btn-add" onclick="addEnemy(this)" style="font-size:12px; background:#1e1e1e; border: 1px solid #3e3e42;">+ Враг</button></div>`); updatePhaseTime(c.lastElementChild.querySelector('.p-start')); }
        function addEnemy(btn) { let r = document.createElement('div'); r.className = 'row enemy-row'; r.innerHTML = `<select class="e-id" style="flex:2">${ENEMY_IDS.map(i=>`<option value="${i}">${i}</option>`).join('')}</select><input type="number" step="0.1" class="e-w" value="100" style="flex:1"><button class="btn-remove" onclick="this.parentElement.remove()">✖</button>`; btn.previousElementSibling.appendChild(r); }
        function initSortable() { let w = document.getElementById('waves-list'); if (w) new Sortable(w, { handle: '.folder-drag', animation: 150 }); document.querySelectorAll('.folder-content').forEach(e => new Sortable(e, { group: 'waves', handle: '.drag-handle', animation: 150 })); }

        function exportBackup() { try { syncData(); if(!currentData) return; let a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2)); a.download = "Backup.json"; document.body.appendChild(a); a.click(); a.remove(); } catch(e){} }
        function importBackup(e) { let f = e.target.files[0]; if(!f) return; let r = new FileReader(); r.onload = function(x) { try { currentData = JSON.parse(x.target.result); render(); document.getElementById('status').innerText = "✅ Бэкап загружен!"; document.getElementById('status').style.color = "#4ec9b0"; e.target.value = ''; } catch(err) { alert("Ошибка файла!"); } }; r.readAsText(f); }

        async function load() { if(!token) { token = prompt("Token:"); if(token) localStorage.setItem('gh_token', token); } if(!token) return; document.getElementById('status').innerText = "🔄 Загрузка..."; try { let r = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers: { Authorization: 'token '+token }}); let g = await r.json(); currentData = JSON.parse(g.files[FILE_NAME].content); render(); document.getElementById('status').innerText = "✅ Готово!"; setTimeout(()=>document.getElementById('status').innerText="",2000); } catch(e) { document.getElementById('status').innerText = "❌ Ошибка"; } }
        async function saveData() { syncData(); document.getElementById('status').innerText = "⏳ Сохранение..."; try { await fetch(`https://api.github.com/gists/${GIST_ID}`, { method: 'PATCH', headers: { Authorization: 'token '+token }, body: JSON.stringify({ files: { [FILE_NAME]: { content: JSON.stringify(currentData, null, 2) } } }) }); document.getElementById('status').innerText = "✅ СОХРАНЕНО!"; undoStack = []; document.getElementById('btn-undo').style.display = 'none'; } catch(e) { document.getElementById('status').innerText = "❌ ОШИБКА"; } }

        load();
    </script>
</body>
</html>
