<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Unity Config Admin</title>
    <style>
        body { background: #1e1e1e; color: #d4d4d4; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .panel { background: #2d2d30; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #3e3e42; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #569cd6; text-align: center; margin-bottom: 20px;}
        h3 { color: #4ec9b0; margin-top: 0; }
        h4 { color: #ce9178; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #9cdcfe; }
        
        input[type="number"], input[type="text"], select { background: #3e3e42; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 10px; outline: none; font-size: 14px;}
        input:focus, select:focus { border-color: #007acc; }
        select { cursor: pointer; appearance: none; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #4ec9b0;}
        
        button { border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .btn-main { background: #0e639c; color: white; width: 100%; font-size: 16px; padding: 15px;}
        .btn-main:hover { background: #1177bb; }
        .btn-save { background: #238636; margin-top: 15px; }
        .btn-save:hover { background: #2ea043; }
        
        .btn-add { background: #1f6b35; color: white; width: 100%; margin-top: 10px; border: 1px dashed #4ec9b0;}
        .btn-add:hover { background: #2a8a46; }
        .btn-add-small { background: #2d5a3c; color: white; padding: 5px 10px; font-size: 12px; }
        .btn-add-small:hover { background: #3a754e; }
        
        .btn-remove { background: #8a2a2a; color: white; padding: 8px 12px; margin-left: 10px;}
        .btn-remove:hover { background: #a83232; }
        .btn-remove-small { background: #8a2a2a; color: white; padding: 8px; height: 35px; margin-top: 24px;}
        .btn-remove-small:hover { background: #a83232; }

        .row { display: flex; gap: 15px; margin-bottom: 5px; align-items: flex-start; }
        .header-row { display: flex; justify-content: space-between; border-bottom: 1px solid #3e3e42; padding-bottom: 10px; margin-bottom: 15px; align-items: center;}
        .status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 18px; }
        
        .auth-panel { background: #3e3e42; padding: 10px; border-radius: 4px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;}
        .btn-reset { background: #555; color: white; padding: 5px 10px; font-size: 12px; }
        .btn-reset:hover { background: #777; }

        /* Вкладки */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: #2d2d30; color: #888; padding: 12px; font-size: 16px; border-bottom: 3px solid transparent; border-radius: 4px 4px 0 0; }
        .tab-btn:hover { background: #3e3e42; color: #ddd; }
        .tab-btn.active { background: #1e1e1e; color: #fff; border-bottom: 3px solid #4ec9b0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ Remote Config Admin Panel</h2>
        
        <div class="auth-panel" id="authPanel" style="display: none;">
            <span style="color: #4ec9b0; font-size: 14px;">🔑 Устройство авторизовано</span>
            <button class="btn-reset" onclick="resetToken()">Сбросить Токен</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="btn-waves" onclick="switchTab('waves')">🌊 Волны и Спавн</button>
            <button class="tab-btn" id="btn-upgrades" onclick="switchTab('upgrades')">🃏 Карточки Апгрейдов</button>
        </div>

        <div id="status" class="status" style="margin-bottom: 15px;"></div>

        <div id="tab-waves" class="tab-content active">Загрузка данных...</div>
        <div id="tab-upgrades" class="tab-content">Загрузка данных...</div>

        <button class="btn-main btn-save" onclick="saveData()">💾 СОХРАНИТЬ ВСЁ В GITHUB</button>
    </div>

    <script>
        // ==========================================
        const GIST_ID = 'ВСТАВЬ_СЮДА_ТОЛЬКО_ID_GIST'; 
        const FILE_NAME = 'config.json';
        // ==========================================
        
        const ENEMY_IDS = [
            "Enemy_Standard", "Enemy_Runner", "Enemy_armor", 
            "Enemy_Tank_Explotion", "Enemy_Tank", "Enemy_Drone", 
            "Helth", "Weapon"
        ];

        let currentData = null;
        let githubToken = localStorage.getItem('gh_token');

        function switchTab(tabId) {
            syncUIToData(); // Сохраняем введенное перед переключением
            document.getElementById('btn-waves').classList.remove('active');
            document.getElementById('btn-upgrades').classList.remove('active');
            document.getElementById('tab-waves').classList.remove('active');
            document.getElementById('tab-upgrades').classList.remove('active');
            
            document.getElementById(`btn-${tabId}`).classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
            renderUI();
        }

        function checkAuth() {
            if (!githubToken) {
                githubToken = prompt("Введите ваш GitHub Token:\n(Он сохранится только в памяти этого браузера)");
                if (githubToken) {
                    localStorage.setItem('gh_token', githubToken.trim());
                    githubToken = githubToken.trim();
                } else {
                    document.getElementById('status').innerText = "❌ Нет доступа. Обновите страницу и введите токен.";
                    document.getElementById('status').style.color = "#f48771";
                    return false;
                }
            }
            document.getElementById('authPanel').style.display = 'flex';
            return true;
        }

        function resetToken() {
            if(confirm("Удалить токен с этого устройства?")) {
                localStorage.removeItem('gh_token');
                location.reload();
            }
        }

        async function loadData() {
            if (!checkAuth()) return;
            document.getElementById('status').innerText = "🔄 Подключение к GitHub...";
            document.getElementById('status').style.color = "#dcdcaa";
            try {
                const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    headers: { 'Authorization': `token ${githubToken}` }
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        localStorage.removeItem('gh_token');
                        throw new Error("Неверный Токен! Я удалил его. Обновите страницу.");
                    }
                    throw new Error("Ошибка загрузки");
                }
                const gist = await res.json();
                const content = gist.files[FILE_NAME].content;
                currentData = JSON.parse(content);
                renderUI(); 
                document.getElementById('status').innerText = "✅ Данные загружены!";
                document.getElementById('status').style.color = "#4ec9b0";
                setTimeout(() => document.getElementById('status').innerText = "", 3000);
            } catch (e) {
                document.getElementById('status').innerText = "❌ " + e.message;
                document.getElementById('status').style.color = "#f48771";
            }
        }

        // Синхронизация полей ввода с объектом currentData
        function syncUIToData() {
            if (!currentData) return;
            
            // Синхронизируем вкладку Волн
            if (document.getElementById('totalTime')) {
                currentData.totalLevelTime = parseFloat(document.getElementById('totalTime').value);
                currentData.bossTriggerTimes = document.getElementById('bossTimes').value.split(',').map(n => parseFloat(n.trim()));
                currentData.phases.forEach((phase, pIndex) => {
                    phase.phaseName = document.getElementById(`p_name_${pIndex}`).value;
                    phase.startTime = parseFloat(document.getElementById(`p_start_${pIndex}`).value);
                    phase.endTime = parseFloat(document.getElementById(`p_end_${pIndex}`).value);
                    phase.spawnInterval = parseFloat(document.getElementById(`p_interval_${pIndex}`).value);
                    phase.enemiesPerBatch = parseInt(document.getElementById(`p_batch_${pIndex}`).value);
                    phase.enemies.forEach((enemy, eIndex) => {
                        enemy.enemyID = document.getElementById(`e_id_${pIndex}_${eIndex}`).value;
                        enemy.weight = parseFloat(document.getElementById(`e_weight_${pIndex}_${eIndex}`).value);
                    });
                });
            }

            // Синхронизируем вкладку Апгрейдов
            if (currentData.upgrades && document.getElementById('u_enabled_0')) {
                currentData.upgrades.forEach((upg, uIndex) => {
                    upg.isEnabled = document.getElementById(`u_enabled_${uIndex}`).checked;
                    for (let i = 0; i < 5; i++) {
                        upg.levelValues[i] = parseFloat(document.getElementById(`u_val_${uIndex}_${i}`).value);
                    }
                });
            }
        }

        function addPhase() { syncUIToData(); currentData.phases.push({ phaseName: "Новая Волна", startTime: 0, endTime: 60, spawnInterval: 1.0, enemiesPerBatch: 1, enemies: [{ enemyID: ENEMY_IDS[0], weight: 100.0 }] }); renderUI(); }
        function removePhase(pIndex) { if(!confirm("Точно удалить?")) return; syncUIToData(); currentData.phases.splice(pIndex, 1); renderUI(); }
        function addEnemy(pIndex) { syncUIToData(); currentData.phases[pIndex].enemies.push({ enemyID: ENEMY_IDS[0], weight: 50.0 }); renderUI(); }
        function removeEnemy(pIndex, eIndex) { syncUIToData(); currentData.phases[pIndex].enemies.splice(eIndex, 1); renderUI(); }

        function renderUI() {
            if (!currentData) return;
            
            // --- ОТРИСОВКА ВОЛН ---
            let wHtml = `
                <div class="panel">
                    <h3>Общие настройки уровня</h3>
                    <div class="row">
                        <div style="flex:1"><label>Total Level Time (сек):</label><input type="number" id="totalTime" value="${currentData.totalLevelTime}"></div>
                        <div style="flex:2"><label>Boss Trigger Times (через запятую):</label><input type="text" id="bossTimes" value="${currentData.bossTriggerTimes.join(', ')}"></div>
                    </div>
                </div>`;

            currentData.phases.forEach((phase, pIndex) => {
                wHtml += `<div class="panel">
                    <div class="header-row">
                        <div style="flex:1; display:flex; gap:10px; align-items:center;">
                            <h3 style="margin:0;">Волна:</h3>
                            <input type="text" id="p_name_${pIndex}" value="${phase.phaseName}" style="margin:0; font-weight:bold; font-size:16px;">
                        </div>
                        <button class="btn-remove" onclick="removePhase(${pIndex})">✖ УДАЛИТЬ ВОЛНУ</button>
                    </div>
                    <div class="row">
                        <div style="flex:1"><label>Start:</label><input type="number" step="0.1" id="p_start_${pIndex}" value="${phase.startTime}"></div>
                        <div style="flex:1"><label>End:</label><input type="number" step="0.1" id="p_end_${pIndex}" value="${phase.endTime}"></div>
                        <div style="flex:1"><label>Interval:</label><input type="number" step="0.1" id="p_interval_${pIndex}" value="${phase.spawnInterval}"></div>
                        <div style="flex:1"><label>Batch:</label><input type="number" id="p_batch_${pIndex}" value="${phase.enemiesPerBatch}"></div>
                    </div>
                    <h4>Враги: <button class="btn-add-small" onclick="addEnemy(${pIndex})">➕ Добавить</button></h4>`;
                
                phase.enemies.forEach((enemy, eIndex) => {
                    let optionsHtml = ""; let isKnown = false;
                    ENEMY_IDS.forEach(id => {
                        let selected = (id === enemy.enemyID) ? "selected" : "";
                        if (selected) isKnown = true;
                        optionsHtml += `<option value="${id}" ${selected}>${id}</option>`;
                    });
                    if (!isKnown) optionsHtml += `<option value="${enemy.enemyID}" selected>${enemy.enemyID} (Неизвестный)</option>`;

                    wHtml += `
                        <div class="row">
                            <div style="flex:3"><select id="e_id_${pIndex}_${eIndex}">${optionsHtml}</select></div>
                            <div style="flex:1"><input type="number" id="e_weight_${pIndex}_${eIndex}" value="${enemy.weight}"></div>
                            <button class="btn-remove-small" onclick="removeEnemy(${pIndex}, ${eIndex})">✖</button>
                        </div>`;
                });
                wHtml += `</div>`;
            });
            wHtml += `<button class="btn-add" onclick="addPhase()">➕ ДОБАВИТЬ НОВУЮ ВОЛНУ</button>`;
            document.getElementById('tab-waves').innerHTML = wHtml;

            // --- ОТРИСОВКА АПГРЕЙДОВ ---
            let uHtml = '';
            if (currentData.upgrades) {
                currentData.upgrades.forEach((upg, uIndex) => {
                    let checked = upg.isEnabled ? "checked" : "";
                    uHtml += `
                    <div class="panel">
                        <div class="header-row">
                            <h3 style="margin:0; color:#569cd6;">${upg.type}</h3>
                            <label style="margin:0; display:flex; align-items:center; gap:5px; cursor:pointer; font-size:15px; color:#fff;">
                                <input type="checkbox" id="u_enabled_${uIndex}" ${checked} style="width:20px; height:20px; margin:0;">
                                Карточка Включена
                            </label>
                        </div>
                        <h4 style="color:#888; margin-top:5px; font-size:12px;">Уровни прокачки (1 - 5):</h4>
                        <div class="row">
                            <div style="flex:1"><label>Lv 1:</label><input type="number" step="0.01" id="u_val_${uIndex}_0" value="${upg.levelValues[0]}"></div>
                            <div style="flex:1"><label>Lv 2:</label><input type="number" step="0.01" id="u_val_${uIndex}_1" value="${upg.levelValues[1]}"></div>
                            <div style="flex:1"><label>Lv 3:</label><input type="number" step="0.01" id="u_val_${uIndex}_2" value="${upg.levelValues[2]}"></div>
                            <div style="flex:1"><label>Lv 4:</label><input type="number" step="0.01" id="u_val_${uIndex}_3" value="${upg.levelValues[3]}"></div>
                            <div style="flex:1"><label>Lv 5:</label><input type="number" step="0.01" id="u_val_${uIndex}_4" value="${upg.levelValues[4]}"></div>
                        </div>
                    </div>`;
                });
            } else {
                uHtml = "<p style='color:#f48771'>В JSON не найден массив upgrades!</p>";
            }
            document.getElementById('tab-upgrades').innerHTML = uHtml;
        }

        async function saveData() {
            document.getElementById('status').innerText = "⏳ Отправка в облако...";
            document.getElementById('status').style.color = "#dcdcaa";
            
            syncUIToData(); // Собираем данные с обеих вкладок
            
            const updatedJson = JSON.stringify(currentData, null, 2);
            try {
                const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({ files: { [FILE_NAME]: { content: updatedJson } } })
                });
                if (res.ok) {
                    document.getElementById('status').innerText = "✅ БАЛАНС ОБНОВЛЕН!";
                    document.getElementById('status').style.color = "#238636";
                } else throw new Error("Сервер отклонил сохранение");
            } catch (e) {
                document.getElementById('status').innerText = "❌ Ошибка: " + e.message;
                document.getElementById('status').style.color = "#f48771";
            }
        }
        
        loadData();
    </script>
</body>
</html>
