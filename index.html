<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Unity Config Admin PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { background: #1e1e1e; color: #d4d4d4; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .panel { background: #2d2d30; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #3e3e42; position: relative; }
        .drag-handle { cursor: grab; padding: 10px; color: #569cd6; font-size: 20px; display: flex; align-items: center; justify-content: center; background: #3e3e42; border-radius: 4px; margin-right: 15px;}
        h2 { color: #569cd6; text-align: center; }
        h3 { color: #4ec9b0; margin: 0; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #9cdcfe; }
        input, select { background: #3e3e42; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 14px;}
        .btn-main { background: #238636; color: white; width: 100%; padding: 15px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; font-size: 16px; margin-top: 20px;}
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: #2d2d30; color: #888; border: none; cursor: pointer; border-radius: 4px 4px 0 0; }
        .tab-btn.active { background: #1e1e1e; color: #fff; border-bottom: 3px solid #4ec9b0; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .row { display: flex; gap: 10px; align-items: flex-start; }
        .header-row { display: flex; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #3e3e42; padding-bottom: 10px; }
        .btn-add { background: #1f6b35; color: white; width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .btn-remove { background: #8a2a2a; color: white; padding: 8px; border: none; border-radius: 4px; cursor: pointer; }
        .status { text-align: center; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ Remote Admin PRO</h2>
        <div id="status" class="status"></div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('waves')">🌊 Волны</button>
            <button class="tab-btn" onclick="switchTab('weapons')">🔫 Оружие</button>
            <button class="tab-btn" onclick="switchTab('upgrades')">🃏 Карточки</button>
        </div>
        <div id="tab-waves" class="tab-content active"><div id="waves-list"></div><button class="btn-add" onclick="addPhase()">➕ Добавить Волну</button></div>
        <div id="tab-weapons" class="tab-content"></div>
        <div id="tab-upgrades" class="tab-content"></div>
        <button class="btn-main" onclick="saveData()">💾 СОХРАНИТЬ ВСЁ В GITHUB</button>
    </div>

    <script>
        const GIST_ID = '4b5faafac858635664755b821b757d35';
        const FILE_NAME = 'config.json';
        let currentData = null;
        let token = localStorage.getItem('gh_token');

        function switchTab(t) {
            syncData();
            document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + t).classList.add('active');
            render();
        }

        // Авто-исправление запятых
        function clean(val) { return parseFloat(String(val).replace(',', '.')); }

        function syncData() {
            if(!currentData) return;
            // Волны
            const wavePanels = document.querySelectorAll('#waves-list .panel');
            let newPhases = [];
            wavePanels.forEach((panel, i) => {
                let phase = {
                    phaseName: panel.querySelector('.p-name').value,
                    startTime: clean(panel.querySelector('.p-start').value),
                    endTime: clean(panel.querySelector('.p-end').value),
                    spawnInterval: clean(panel.querySelector('.p-int').value),
                    enemiesPerBatch: parseInt(panel.querySelector('.p-batch').value),
                    enemies: []
                };
                panel.querySelectorAll('.enemy-row').forEach(row => {
                    phase.enemies.push({ enemyID: row.querySelector('.e-id').value, weight: clean(row.querySelector('.e-w').value) });
                });
                newPhases.push(phase);
            });
            currentData.phases = newPhases;

            // Оружие
            if(document.querySelector('.w-dmg')) {
                currentData.weapons.forEach((w, i) => {
                    w.damage = clean(document.getElementById(`w_dmg_${i}`).value);
                    w.fireRate = clean(document.getElementById(`w_fr_${i}`).value);
                    w.maxDistance = clean(document.getElementById(`w_dist_${i}`).value);
                    w.spread = clean(document.getElementById(`w_spr_${i}`).value);
                });
            }

            // Апгрейды
            if(document.querySelector('.u-base')) {
                currentData.upgrades.forEach((u, i) => {
                    u.isEnabled = document.getElementById(`u_en_${i}`).checked;
                    u.baseValue = clean(document.getElementById(`u_base_${i}`).value);
                    u.levelValues = [0,1,2,3,4].map(lv => clean(document.getElementById(`u_lv_${i}_${lv}`).value));
                });
            }
        }

        function render() {
            if(!currentData) return;
            // Рендер волн
            let h = '';
            currentData.phases.forEach((p, i) => {
                h += `<div class="panel" data-id="${i}">
                    <div class="header-row">
                        <div class="drag-handle">☰</div>
                        <input type="text" class="p-name" value="${p.phaseName}" style="margin:0; font-weight:bold;">
                        <button class="btn-remove" onclick="this.closest('.panel').remove()" style="margin-left:10px">✖</button>
                    </div>
                    <div class="row">
                        <div style="flex:1"><label>Start</label><input type="number" step="0.1" class="p-start" value="${p.startTime}"></div>
                        <div style="flex:1"><label>End</label><input type="number" step="0.1" class="p-end" value="${p.endTime}"></div>
                        <div style="flex:1"><label>Interval</label><input type="number" step="0.1" class="p-int" value="${p.spawnInterval}"></div>
                        <div style="flex:1"><label>Batch</label><input type="number" class="p-batch" value="${p.enemiesPerBatch}"></div>
                    </div>
                    <div class="enemies-list">`;
                p.enemies.forEach(e => {
                    h += `<div class="row enemy-row">
                        <input type="text" class="e-id" value="${e.enemyID}" style="flex:2">
                        <input type="number" class="e-w" value="${e.weight}" style="flex:1">
                        <button class="btn-remove" onclick="this.parentElement.remove()">✖</button>
                    </div>`;
                });
                h += `</div><button class="btn-add" onclick="addEnemy(this)" style="font-size:12px">+ Враг</button></div>`;
            });
            document.getElementById('waves-list').innerHTML = h;
            initSortable();

            // Рендер оружия
            let wh = '';
            currentData.weapons.forEach((w, i) => {
                wh += `<div class="panel"><h3>${w.weaponName}</h3><div class="row">
                    <div style="flex:1"><label>Dmg</label><input type="number" id="w_dmg_${i}" class="w-dmg" value="${w.damage}"></div>
                    <div style="flex:1"><label>Rate</label><input type="number" step="0.1" id="w_fr_${i}" value="${w.fireRate}"></div>
                    <div style="flex:1"><label>Dist</label><input type="number" id="w_dist_${i}" value="${w.maxDistance}"></div>
                    <div style="flex:1"><label>Spr</label><input type="number" id="w_spread_${i}" value="${w.spread}"></div>
                </div></div>`;
            });
            document.getElementById('tab-weapons').innerHTML = wh;

            // Рендер апгрейдов
            let uh = '';
            currentData.upgrades.forEach((u, i) => {
                uh += `<div class="panel">
                    <div class="header-row"><h3>${u.type}</h3><input type="checkbox" id="u_en_${i}" ${u.isEnabled?'checked':''} style="width:20px"></div>
                    <div class="row"><div style="flex:1"><label>БАЗА (Старт)</label><input type="number" step="0.1" id="u_base_${i}" class="u-base" value="${u.baseValue}" style="border:1px solid #4ec9b0"></div></div>
                    <div class="row">
                        ${u.levelValues.map((v, lv) => `<div style="flex:1"><label>Lv${lv+1}</label><input type="number" step="0.01" id="u_lv_${i}_${lv}" value="${v}"></div>`).join('')}
                    </div>
                </div>`;
            });
            document.getElementById('tab-upgrades').innerHTML = uh;
        }

        function initSortable() {
            new Sortable(document.getElementById('waves-list'), { handle: '.drag-handle', animation: 150 });
        }

        function addPhase() {
            let list = document.getElementById('waves-list');
            let div = document.createElement('div');
            div.className = 'panel';
            div.innerHTML = `<div class="header-row"><div class="drag-handle">☰</div><input type="text" class="p-name" value="Новая волна"><button class="btn-remove" onclick="this.closest('.panel').remove()">✖</button></div><div class="row"><div><label>Start</label><input type="number" class="p-start" value="0"></div><div><label>End</label><input type="number" class="p-end" value="60"></div><div><label>Interval</label><input type="number" class="p-int" value="1"></div><div><label>Batch</label><input type="number" class="p-batch" value="1"></div></div><div class="enemies-list"></div><button class="btn-add" onclick="addEnemy(this)">+ Враг</button>`;
            list.appendChild(div);
        }

        function addEnemy(btn) {
            let row = document.createElement('div'); row.className = 'row enemy-row';
            row.innerHTML = `<input type="text" class="e-id" value="Enemy_Standard" style="flex:2"><input type="number" class="e-w" value="100" style="flex:1"><button class="btn-remove" onclick="this.parentElement.remove()">✖</button>`;
            btn.previousElementSibling.appendChild(row);
        }

        async function load() {
            if(!token) { token = prompt("GitHub Token:"); localStorage.setItem('gh_token', token); }
            const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers: { Authorization: 'token '+token }});
            const gist = await res.json();
            currentData = JSON.parse(gist.files[FILE_NAME].content);
            render();
        }

        async function saveData() {
            syncData();
            document.getElementById('status').innerText = "⏳ Сохранение...";
            const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                method: 'PATCH',
                headers: { Authorization: 'token '+token },
                body: JSON.stringify({ files: { [FILE_NAME]: { content: JSON.stringify(currentData, null, 2) } } })
            });
            document.getElementById('status').innerText = res.ok ? "✅ УСПЕШНО!" : "❌ ОШИБКА!";
        }

        load();
    </script>
</body>
</html>
